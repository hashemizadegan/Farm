name: tmp-preview-shots
# Temporary: copies review screenshots of the isolated preview from short-lived pre-signed URLs into a run artifact.
# No secret is read or stored; the URLs expire within minutes. Delete this branch after use.
on:
  push:
    branches: [tmp/preview-shots]
  workflow_dispatch:
    inputs:
      urls:
        description: "space-separated name=presigned-url pairs (expire in minutes)"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir shots
          for pair in $URLS; do
            name="${pair%%=*}"; url="${pair#*=}"
            curl -fsS -o "shots/$name.jpg" "$url"
          done
          ls -la shots
      # The files are ciphertext (encrypted for the reviewer's key before they left the preview project).
      - uses: actions/checkout@v4
        with: { path: repo }
      - name: Commit the encrypted files to this temporary branch
        run: |
          mkdir -p repo/shots && cp shots/* repo/shots/
          cd repo && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add shots && git commit -m "tmp: encrypted preview screenshots" && git push origin HEAD:tmp/preview-shots
