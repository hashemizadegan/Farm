name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Test-only values. Never reuse in deployed environments.
  DEV_AUTH_SECRET: ci-only-dev-secret-0123456789abcdef0123
  WEBHOOK_SIGNING_SECRETS: ci-webhook-secret

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
      - name: Install dependencies
        # Frozen once pnpm-lock.yaml is committed; the fallback only helps the very first run.
        # On failure, the last lines are surfaced as an annotation (readable without log access).
        run: |
          set -o pipefail
          if [ -f pnpm-lock.yaml ]; then flags=--frozen-lockfile; else flags=--no-frozen-lockfile; fi
          if ! pnpm install $flags 2>&1 | tee install.log; then
            tail -25 install.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=pnpm install failed::/'
            echo
            exit 1
          fi
      - name: Generated API types are produced from openapi.yaml
        run: test -f packages/contracts/src/generated/api.ts
      - name: Upload lockfile (commit it to enable frozen installs and caching)
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 7

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}" }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - run: pnpm lint
      - name: Lint OpenAPI document
        run: pnpm --filter @metafarm/contracts lint:openapi

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}" }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - run: pnpm typecheck

  unit:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}" }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: pnpm test:unit
        # On failure, the failing files, tests and errors are surfaced as annotations (readable without log access).
        run: |
          set -o pipefail
          if ! pnpm test:unit 2>&1 | tee unit.log; then
            # One annotation (GitHub keeps at most 10 per step): the failing lines, newline-encoded.
            echo "::error title=pnpm test:unit failed::$(grep -E "FAIL|AssertionError|Error|Unhandled|×|✗|Test Files|Tests |expected|received" unit.log | tail -45 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          fi

  integration:
    name: Integration tests (PostGIS, Redis)
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: metafarm
          POSTGRES_PASSWORD: metafarm
          POSTGRES_DB: metafarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metafarm" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://metafarm:metafarm@localhost:5432/metafarm
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}" }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Migrate (up, down, up) to prove reversibility on an empty database
        run: |
          pnpm db:migrate
          pnpm --filter @metafarm/db migrate:down
          pnpm db:migrate
      - name: pnpm test:integration
        # On failure, the failing files, tests and errors are surfaced as annotations (readable without log access).
        run: |
          set -o pipefail
          if ! pnpm test:integration 2>&1 | tee integration.log; then
            # One annotation (GitHub keeps at most 10 per step): the failing lines, newline-encoded.
            echo "::error title=pnpm test:integration failed::$(grep -E "FAIL|AssertionError|Error|Unhandled|×|✗|Test Files|Tests |expected|received" integration.log | tail -45 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          fi

  contracts:
    name: Contract tests (Solidity)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}" }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - run: pnpm --filter @metafarm/nft-contracts compile
      - run: pnpm test:contracts

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}" }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Build all packages (errors are surfaced as an annotation)
        run: |
          set -o pipefail
          if ! pnpm build 2>&1 | tee build.log; then
            grep -nE "error|Error|ERR_|failed|Type error" build.log | tail -30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=pnpm build failed::/'
            echo
            exit 1
          fi
      - name: Smoke-test the bundled services (they must load and reach config validation)
        # With no configuration each service should stop with its own config error, which
        # proves every bundled module (including CommonJS dependencies) loads under Node.
        run: |
          set -u
          check() {
            out=$(env -i PATH="$PATH" node "$1" 2>&1 || true)
            echo "$out" | grep -q "$2" || { echo "::error::$1 did not reach config validation"; echo "$out" | head -40; exit 1; }
            echo "ok: $1"
          }
          check apps/api/dist/main.js "Invalid environment configuration"
          check apps/api/dist/migrate.js "DATABASE_URL is required"
          check apps/worker/dist/main.js "Invalid environment configuration"
          check apps/scheduler/dist/main.js "Invalid environment configuration"

  e2e:
    name: Playwright
    needs: [unit, integration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: metafarm
          POSTGRES_PASSWORD: metafarm
          POSTGRES_DB: metafarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metafarm" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgres://metafarm:metafarm@localhost:5432/metafarm
      REDIS_URL: redis://localhost:6379
      STORAGE_DRIVER: memory
      AUTH_PROVIDER: dev
      # 3101: a second web server with the preview access gate on (tests/e2e/preview-gate.spec.ts).
      CORS_ORIGINS: http://localhost:3000,http://localhost:3101
      NEXT_PUBLIC_API_URL: http://localhost:4000
      E2E_GATED_WEB_URL: http://localhost:3101
      # Test-only value. Never reuse in a deployed preview.
      E2E_PREVIEW_ACCESS_PASSWORD: ci-only-preview-password-0123456789
      # Every browser in the run shares one client IP; the production per-IP limit would throttle the suite.
      RATE_LIMIT_MAX: "10000"
      # J8 is off by default everywhere; the e2e stack turns it on to test the account page's linking flow.
      PLAYER_WALLETS_ENABLED: "true"
      NEXT_PUBLIC_PLAYER_WALLETS_ENABLED: "true"
      # Y10/Y13 operator pages with simulation data (APP_ENV=test only; off by default and refused when deployed).
      YIELD_WORKFLOW_ENABLED: "true"
      YIELD_CLAIM_INTENTS_ENABLED: "true"
      NEXT_PUBLIC_YIELD_PAGES_ENABLED: "true"
      # Realtime channel (API and worker), registered integrations and the web app's live updates, exercised end to end
      # (tests/e2e/integrations-realtime.spec.ts). APP_ENV=test only: refused in staging/production. Test-only key.
      REALTIME_EVENTS_ENABLED: "true"
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:4000/v1/realtime
      INTEGRATION_SECRET_KEY: ci-only-integration-key-0123456789abcdef
      # Marketplace (simulation only; refused in production): the two-party journey and its seeded demo
      # (tests/e2e/marketplace-journey.spec.ts, apps/api/src/scripts/seed-marketplace.ts).
      MARKETPLACE_ENABLED: "true"
      NEXT_PUBLIC_MARKETPLACE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}" }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      # The preview's farm operations seed too (tests/e2e/preview-journey.spec.ts walks it, as against a preview).
      - run: pnpm db:migrate && pnpm db:seed && pnpm seed:farm-ops && pnpm seed:marketplace
      - run: pnpm --filter @metafarm/web build
      - run: pnpm --filter @metafarm/e2e install-browsers
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yield-screenshots
          path: tests/yield-screenshots
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: Dependency audit
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}" }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      # Fails on high/critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level high

  unity-starter:
    name: Unity starter core (C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Runtime/Core as netstandard2.1 (C# 9) and run its tests
        # Runtime/Unity needs the Unity editor and is not built here.
        # On failure, the relevant lines are surfaced as annotations (readable without log access).
        run: |
          set -o pipefail
          dotnet test "clients/unity-starter/Tests~/Metafarm.Twin.Core.Tests/Metafarm.Twin.Core.Tests.csproj" --nologo 2>&1 | tee dotnet.txt || {
            grep -E "error|Failed|Assert|Expected|Actual" dotnet.txt | tail -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          # Surface the test counts as an annotation, so the result is visible without log access.
          grep -E "Passed!|Failed!|Total tests" dotnet.txt | while IFS= read -r l; do echo "::notice::$l"; done

  docker:
    name: Docker image (${{ matrix.app }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, scheduler, web, seed-runner]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: metafarm-${{ matrix.app }}:ci
          load: ${{ matrix.app == 'seed-runner' }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=http://localhost:4000
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Web build refuses the yield pages for staging/production (D-39 guard reaches Docker builds)
        if: matrix.app == 'web'
        run: |
          set +e
          docker buildx build --target build-web --build-arg APP=web --build-arg APP_ENV=production \
            --build-arg NEXT_PUBLIC_YIELD_PAGES_ENABLED=true --cache-from type=gha,scope=web . > web-guard.log 2>&1
          code=$?
          set -e
          tail -5 web-guard.log
          test "$code" -ne 0 && grep -q "NEXT_PUBLIC_YIELD_PAGES_ENABLED is refused" web-guard.log
      - name: Seed runner refuses deployed environments (no database needed)
        if: matrix.app == 'seed-runner'
        run: |
          set -u
          for env in production staging; do
            set +e; out=$(docker run --rm -e APP_ENV=$env -e DATABASE_URL=postgres://u:p@127.0.0.1:1/x metafarm-seed-runner:ci 2>&1); code=$?; set -e
            echo "$out"
            test "$code" -eq 1 && echo "$out" | grep -q "refused: APP_ENV must be development or test"
          done
          set +e; out=$(docker run --rm metafarm-seed-runner:ci 2>&1); code=$?; set -e
          test "$code" -eq 1 && echo "$out" | grep -q "refused: APP_ENV must be"
