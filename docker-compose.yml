# Local development dependencies. Application processes run on the host with `pnpm dev`.
# None of these settings are suitable for production.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: metafarm
      POSTGRES_PASSWORD: metafarm # local only
      POSTGRES_DB: metafarm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metafarm -d metafarm"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # S3-compatible object storage for signed-URL uploads.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: metafarm # local only
      MINIO_ROOT_PASSWORD: metafarm-local-only
      # Lets the browser PUT to presigned URLs from the local web app.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Creates the private uploads bucket.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 metafarm metafarm-local-only &&
      mc mb --ignore-existing local/metafarm-uploads &&
      mc anonymous set none local/metafarm-uploads
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
