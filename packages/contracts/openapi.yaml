        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /v1/tenants/{tenantId}/yield/cycles/{cycleId}/publish:
    parameters: [{ $ref: "#/components/parameters/TenantId" }, { $ref: "#/components/parameters/YieldCycleId" }]
    post:
      tags: [yield]
      summary: "Publish the approved simulation cycle (yield:approve). Off unless YIELD_WORKFLOW_ENABLED (404); simulation cycles only."
      operationId: publishYieldCycle
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /v1/tenants/{tenantId}/yield/cycles/{cycleId}/close:
    parameters: [{ $ref: "#/components/parameters/TenantId" }, { $ref: "#/components/parameters/YieldCycleId" }]
    post:
      tags: [yield]
      summary: "Close a published cycle with a reason (yield:approve). Off unless YIELD_WORKFLOW_ENABLED (404); simulation cycles only."
      operationId: closeYieldCycle
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, enum: [no_distribution, loss, unfunded, simulation] }, note: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /v1/tenants/{tenantId}/yield/cycles/{cycleId}/cancel:
    parameters: [{ $ref: "#/components/parameters/TenantId" }, { $ref: "#/components/parameters/YieldCycleId" }]
    post:
      tags: [yield]
      summary: "Cancel before publication (yield:approve). Off unless YIELD_WORKFLOW_ENABLED (404); simulation cycles only."
      operationId: cancelYieldCycle
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}/account-links:
    parameters: [{ $ref: "#/components/parameters/TenantId" }, { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [rwa]
      summary: "Propose linking an existing party to a member account (rwa:operate). Off unless PARTY_LINKS_ENABLED (404); refused in production (D-29, D-39)."
      operationId: proposePartyAccountLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [userId], properties: { userId: { type: string, format: uuid } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [rwa]
      summary: "A party's account links with their audit events (rwa:read). Off unless PARTY_LINKS_ENABLED (404); refused in production (D-29, D-39)."
      operationId: listPartyAccountLinks
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /v1/tenants/{tenantId}/rwa/account-links/{linkId}/authorise:
    parameters: [{ $ref: "#/components/parameters/TenantId" }, { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [rwa]
      summary: "Authorise a consented link; never the proposer or the linked member (compliance:review). Off unless PARTY_LINKS_ENABLED (404); refused in production (D-29, D-39)."
      operationId: authorisePartyAccountLink
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /v1/tenants/{tenantId}/rwa/account-links/{linkId}/revoke:
    parameters: [{ $ref: "#/components/parameters/TenantId" }, { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [rwa]
      summary: "Revoke a link (rwa:operate); terminal. Off unless PARTY_LINKS_ENABLED (404); refused in production (D-29, D-39)."
      operationId: revokePartyAccountLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /v1/tenants/{tenantId}/me/party-links:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: "The signed-in member's links and the current consent text (not legally approved). Off unless PARTY_LINKS_ENABLED (404); refused in production (D-29, D-39)."
      operationId: listMyPartyLinks
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /v1/tenants/{tenantId}/me/party-links/{linkId}/consent:
    parameters: [{ $ref: "#/components/parameters/TenantId" }, { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [rwa]
      summary: "The linked member consents to the current consent text (version and SHA-256 must match). Off unless PARTY_LINKS_ENABLED (404); refused in production (D-29, D-39)."
      operationId: consentToPartyLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [consentVersion, consentSha256], properties: { consentVersion: { type: string }, consentSha256: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /v1/tenants/{tenantId}/me/party-links/{linkId}/revoke:
    parameters: [{ $ref: "#/components/parameters/TenantId" }, { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [rwa]
      summary: "The linked member revokes their own link; terminal. Off unless PARTY_LINKS_ENABLED (404); refused in production (D-29, D-39)."
      operationId: revokeMyPartyLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    metricsToken:
      type: http
      scheme: bearer
      description: The METRICS_TOKEN platform secret; only for GET /metrics.

  parameters:
    AnchorCarrier:
      name: carrier
      in: query
      required: true
      schema: { type: string, enum: [token2022_metadata, bubblegum_v1_leaf] }
    AnchorNetwork:
      name: network
      in: query
      required: false
      schema: { type: string, enum: [solana-devnet, solana-mainnet], default: solana-devnet }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A UUID chosen by the client. Phones working offline queue writes and resend them; a
        resend with the same key returns the original result instead of recording twice.
        Reusing a key for a different request is a 409.
      schema: { type: string, format: uuid }
    YieldCycleId:
      name: cycleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FarmId:
      name: farmId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    RwaListLimit:
      name: limit
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    RwaListCursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page. An id that is not an item of this list is refused (400 invalid_cursor).
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (also returned for resources in other tenants)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    YieldCycleStatus:
      type: string
      enum: [draft, inputs_locked, calculated, under_review, approved, published, funded, distributing, disputed, closed, cancelled, abandoned, superseded]
    YieldCycle:
      type: object
      required: [id, businessAssetId, period, version, simulation, status, chainAsset, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessAssetId: { type: string, format: uuid }
        period: { type: object, required: [start, end], properties: { start: { type: string, format: date }, end: { type: string, format: date } } }
        version: { type: integer }
        simulation: { type: boolean, description: "Simulation-labelled cycles can never be funded." }
        status: { $ref: "#/components/schemas/YieldCycleStatus" }
        priorStatus: { type: [string, "null"] }
        closeReason: { type: [string, "null"] }
        chainAsset: { type: object, properties: { network: { type: string }, rail: { type: string }, id: { type: string } } }
        entitlementRef: { type: [string, "null"] }
        policyHash: { type: [string, "null"] }
        formulaVersion: { type: [string, "null"] }
        accountingCurrency: { type: [string, "null"] }
        settlement: { type: [object, "null"], properties: { mint: { type: string }, decimals: { type: integer } } }
        slotRange: { type: [object, "null"], properties: { start: { type: string }, end: { type: string } } }
        artifactSetHash: { type: [string, "null"] }
        merkleRoot: { type: [string, "null"] }
        preparedBy: { type: [string, "null"], format: uuid }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    YieldArtifactSet:
      type: object
      required: [id, setNumber, status, hashes, ownershipSnapshot, attesters, createdAt]
      properties:
        id: { type: string, format: uuid }
        setNumber: { type: integer }
        status: { type: string, enum: [frozen, invalidated, approved, superseded] }
        hashes:
          type: object
          properties:
            calculation: { type: string }
            allocation: { type: string }
            evidenceBundle: { type: string }
            merkleRoot: { type: string }
            set: { type: string }
        ownershipSnapshot:
          type: [object, "null"]
          properties:
            sourceKind: { type: string, enum: [rpc, fixture] }
            sourceIdentityId: { type: [string, "null"] }
            network: { type: string }
            slotRange: { type: object, properties: { start: { type: string }, end: { type: string } } }
            cursorSlot: { type: string }
            holdingModel: { type: string, enum: [slot_weighted] }
            inputCommitment: { type: string }
            totalWeight: { type: string }
        attesters: { type: integer, description: "Attesters whose attestation is not revoked." }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: {}

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, draining] }

    HealthReport:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }

    ProvenanceLabel:
      type: string
      enum: [illustrative, user-entered, provider-observation, sensor-reported, independently-verified]

    Role:
      type: string
      enum: [owner, admin, manager, verifier, worker, viewer]

    TwinChainIdentity:
      type: object
      required: [representationId, rail, network, status, chainId]
      properties:
        representationId: { type: string, format: uuid }
        rail: { type: string, enum: [SOLANA_TOKEN_2022, SOLANA_BUBBLEGUM_CNFT, TRON_TRC20] }
        network: { type: string }
        status: { type: string }
        chainId: { type: [string, "null"], description: "Mint (Token-2022), asset id (Bubblegum) or contract (TRC-20)" }
    TwinObject:
      type: object
      required: [twinObjectId, assetId, layer, kind, name, status, geometry, physical, chain]
      properties:
        twinObjectId: { type: string, description: "asset:<assetId>" }
        assetId: { type: string, format: uuid }
        layer: { type: string, enum: [terrain, plots, crops_trees, livestock, equipment, buildings, storage, output_batches, logistics, shares] }
        kind: { type: string, enum: [parcel, tree, livestock, equipment, harvest_lot, farm_share, building, storage_unit, logistics_lot] }
        name: { type: string }
        status: { type: string, enum: [draft, verified, active, suspended, retired] }
        geometry: { type: [object, "null"], description: GeoJSON (WGS 84) }
        physical:
          type: object
          required: [externalRef, parcelLabel, geomProvenance, verifiedAt]
          properties:
            externalRef: { type: [string, "null"] }
            parcelLabel: { type: [string, "null"] }
            geomProvenance: { type: [string, "null"] }
            verifiedAt: { type: [string, "null"], format: date-time }
        chain: { type: array, items: { $ref: "#/components/schemas/TwinChainIdentity" } }
    TwinScene:
      type: object
      required: [scheme, generatedAt, farm, redacted, objects, nextCursor]
      properties:
        scheme: { type: string, enum: [metafarm-twin-scene/1] }
        generatedAt: { type: string, format: date-time }
        farm:
          type: object
          required: [id, name, origin, outline]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            origin:
              type: [object, "null"]
              required: [lon, lat]
              properties:
                lon: { type: number }
                lat: { type: number }
            outline:
              type: [array, "null"]
              description: Simplified outer ring of the current boundary, [lon, lat] pairs
              items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        redacted: { type: array, items: { type: string } }
        objects: { type: array, items: { $ref: "#/components/schemas/TwinObject" } }
        nextCursor: { type: [string, "null"], format: uuid }
    PlayerWallet:
      type: object
      required: [chain, address, linkedAt]
      properties:
        chain: { type: string, enum: [solana] }
        address: { type: string }
        linkedAt: { type: string, format: date-time }
    TwinOwnership:
      type: object
      required: [representationId, status]
      properties:
        representationId: { type: string, format: uuid }
        status: { type: string, enum: [indexed, not_indexed, not_on_chain] }
        reason: { type: string, enum: [no_ownership_reader, not_covered, reader_unavailable] }
        source: { type: string, enum: [chain_index, das, fixture] }
        assurance: { type: string, enum: [inclusion_verified, indexer_reported, fixture] }
        asOfSlot: { type: [string, "null"] }
        heldByYou:
          type: boolean
          description: |
            Whether the caller's own linked player wallets (/v1/me/player-wallets) hold this, by the
            reading above. Present only when status is indexed, the source is not fixture, player
            wallets are enabled and the caller has linked one; absent means "not stated", never "no".
            RWA party wallets are not considered.
        holders:
          type: array
          items:
            type: object
            required: [owner, amount]
            properties:
              owner: { type: string }
              amount: { type: string, description: Base units }
    TwinAssetDetail:
      type: object
      required: [object, lifecycle, ownership, dataCommitments]
      properties:
        object: { $ref: "#/components/schemas/TwinObject" }
        lifecycle:
          type: array
          items:
            type: object
            required: [event, at]
            properties:
              event: { type: string, enum: [registered, verified] }
              at: { type: string, format: date-time }
        ownership: { type: array, items: { $ref: "#/components/schemas/TwinOwnership" } }
        dataCommitments: { type: array, items: { $ref: "#/components/schemas/DataCommitment" } }
    DataCommitment:
      type: object
      required: [id, farmId, subjectType, subjectId, schema, schemaVersion, contentSha256, byteSize, storageRef, sourceTime, attestationRef, batch, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: [string, "null"], format: uuid }
        subjectType: { type: string, enum: [farm, asset, telemetry_window, media, record, scene_bundle] }
        subjectId: { type: string }
        schema: { type: string }
        schemaVersion: { type: integer }
        contentSha256: { type: string }
        byteSize: { type: [integer, "null"] }
        storageRef: { type: [string, "null"] }
        sourceTime: { type: string, format: date-time }
        attestationRef: { type: [string, "null"] }
        batch:
          type: [object, "null"]
          required: [id, leafIndex]
          properties:
            id: { type: string, format: uuid }
            leafIndex: { type: integer }
        createdAt: { type: string, format: date-time }
    CommitmentBatch:
      type: object
      required: [id, dataset, scheme, merkleRoot, leafCount, anchor, createdAt]
      properties:
        id: { type: string, format: uuid }
        dataset: { type: string }
        scheme: { type: string, enum: [metafarm-merkle-sha256/1] }
        merkleRoot: { type: string }
        leafCount: { type: integer }
        anchor: { type: "null", description: On-chain anchoring is not implemented yet }
        createdAt: { type: string, format: date-time }
    DataCommitmentProof:
      type: object
      required: [commitment, state, proof, anchor]
      properties:
        commitment: { $ref: "#/components/schemas/DataCommitment" }
        state:
          type: string
          enum: [recorded, included, anchored]
          description: "`included` only when the proof was re-checked against the stored root just now; `anchored` is not produced yet"
        proof:
          type: [object, "null"]
          required: [scheme, batchId, dataset, leaf, leafIndex, size, path, root]
          properties:
            scheme: { type: string }
            batchId: { type: string, format: uuid }
            dataset: { type: string }
            leaf: { type: string }
            leafIndex: { type: integer }
            size: { type: integer }
            path: { type: array, items: { type: string } }
            root: { type: string }
        checks:
          type: object
          required: [leavesMatchCommitments, rootMatches, inclusionVerified]
          properties:
            leavesMatchCommitments: { type: boolean }
            rootMatches: { type: boolean }
            inclusionVerified: { type: boolean }
        anchor: { type: "null" }
    TransferPreview:
      type: object
      required: [scheme, representationId, asset, from, to, amount, createdAt, expiresAt, digest, ownershipAsOfSlot, submission]
      properties:
        scheme: { type: string, enum: [metafarm-transfer-preview/1] }
        representationId: { type: string, format: uuid }
        asset:
          type: object
          required: [network, rail, id]
          properties:
            network: { type: string }
            rail: { type: string }
            id: { type: string }
        from: { type: string }
        to: { type: string }
        amount: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        digest: { type: string, description: SHA-256 of the canonical preview }
        ownershipAsOfSlot: { type: [string, "null"] }
        submission:
          type: object
          required: [available, reason]
          properties:
            available: { type: boolean, enum: [false] }
            reason: { type: string, enum: [not_enabled, no_signer, mainnet_blocked, not_implemented] }
    TwinTransaction:
      type: object
      required: [id, intentType, intentId, attempt, network, state, txRef, expiresAt, failed]
      properties:
        id: { type: string, format: uuid }
        intentType: { type: string }
        intentId: { type: string, format: uuid }
        attempt: { type: integer }
        network: { type: string }
        state: { type: string }
        txRef: { type: [string, "null"] }
        expiresAt: { type: [string, "null"], format: date-time }
        failed: { type: boolean }
    TwinSyncStatus:
      type: object
      required: [ownership, submission, representations, dataCommitments]
      properties:
        ownership:
          type: object
          required: [status, source]
          properties:
            status: { type: string, enum: [configured, not_configured] }
            source: { type: [string, "null"] }
        submission:
          type: object
          required: [available, reason]
          properties:
            available: { type: boolean }
            reason: { type: [string, "null"] }
        representations:
          type: object
          required: [total, withChainId, active]
          properties:
            total: { type: integer }
            withChainId: { type: integer }
            active: { type: integer }
        dataCommitments:
          type: object
          required: [total, batched, batches, anchoredBatches]
          properties:
            total: { type: integer }
            batched: { type: integer }
            batches: { type: integer }
            anchoredBatches: { type: integer }
    FarmSnapshotRecord:
      allOf:
        - { $ref: "#/components/schemas/DataCommitment" }
        - type: object
          required: [snapshotId, root, entityCount, takenAt]
          properties:
            snapshotId: { type: [string, "null"], description: SHA-256 of the canonical snapshot header }
            root: { type: [string, "null"] }
            entityCount: { type: [integer, "null"] }
            takenAt: { type: [string, "null"], format: date-time }
    FarmSnapshot:
      type: object
      required: [scheme, snapshotId, farmId, takenAt, entitySchemaVersion, entityCount, root, entities]
      properties:
        scheme: { type: string, enum: [metafarm-farm-snapshot/1] }
        snapshotId: { type: string }
        farmId: { type: string }
        takenAt: { type: string, format: date-time }
        entitySchemaVersion: { type: integer }
        entityCount: { type: integer }
        root: { type: string }
        entities:
          type: array
          items:
            type: object
            required: [type, id, data, sha256]
            properties:
              type: { type: string, enum: [plot, crop, structure, inventory, machine, animal, asset] }
              id: { type: string }
              data: { type: object, additionalProperties: true }
              sha256: { type: string }
    AnchorPlan:
      type: object
      description: Data only. Says what would be written on-chain; never executed in this release.
      required: [scheme, carrier, network, subject, root, executable, reason]
      properties:
        scheme: { type: string, enum: [metafarm-anchor/1] }
        carrier: { type: string, enum: [token2022_metadata, bubblegum_v1_leaf] }
        network: { type: string }
        subject: { type: string, enum: [batch, snapshot] }
        root: { type: string }
        metadataField:
          type: object
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        leafMetadata:
          type: object
          required: [name, symbol, uri]
          properties: { name: { type: string }, symbol: { type: string }, uri: { type: string } }
        executable: { type: boolean, enum: [false] }
        reason: { type: string, enum: [anchoring_not_enabled] }
    FarmSnapshotDocument:
      type: object
      required: [commitment, check, snapshot]
      properties:
        commitment: { $ref: "#/components/schemas/DataCommitment" }
        check:
          type: object
          required: [ok, problems]
          properties:
            ok: { type: boolean }
            problems: { type: array, items: { type: string } }
        snapshot: { $ref: "#/components/schemas/FarmSnapshot" }
    RwaAsset:
      type: object
      required: [id, farmId, farmName, kind, name, externalRef, parcelLabel, geometry, geomProvenance, status, verifiedAt, createdAt, representations]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        kind: { type: string }
        name: { type: string }
        externalRef: { type: [string, "null"] }
        parcelLabel: { type: [string, "null"] }
        geometry: { type: [object, "null"] }
        geomProvenance: { type: [string, "null"] }
        status: { type: string, enum: [draft, verified, active, suspended, retired] }
        verifiedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        representations:
          type: array
          items:
            type: object
            required: [id, rail, network, status, mintAddress, decimals, createdAt]
            properties:
              id: { type: string, format: uuid }
              rail: { type: string }
              network: { type: string }
              status: { type: string }
              mintAddress: { type: [string, "null"] }
              decimals: { type: [integer, "null"] }
              createdAt: { type: string, format: date-time }
    RwaRegistration:
      type: object
      required: [id, reconciliationId, status, asset, custodian, network, leaf, approvedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reconciliationId: { type: string, format: uuid }
        status: { type: string, enum: [open, settling, issuing, completed, cancelled, exception] }
        asset:
          type: object
          required: [id, name, kind]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { type: string, enum: [parcel, tree, livestock] }
        custodian:
          type: object
          required: [partyId, name, solanaWallet]
          properties:
            partyId: { type: string, format: uuid }
            name: { type: string }
            solanaWallet: { type: string }
        network: { type: string, enum: [solana-devnet, solana-mainnet] }
        leaf:
          type: object
          required: [representationId, status, tree, leafIndex, assetId, leafHash, metadataUri]
          properties:
            representationId: { type: string, format: uuid }
            status: { type: string, enum: [planned, issuing, active, frozen, retired] }
            tree: { type: [string, "null"], description: Merkle tree address once the mint is prepared }
            leafIndex: { type: [string, "null"] }
            assetId: { type: [string, "null"], description: DAS asset id }
            leafHash: { type: [string, "null"] }
            metadataUri: { type: string, format: uri }
        approvedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RwaRegistrationDetail:
      allOf:
        - { $ref: "#/components/schemas/RwaRegistration" }
        - type: object
          required: [cases]
          properties:
            cases:
              type: array
              items:
                type: object
                required: [id, kind, status, expected, observed, openedAt, resolvedAt, resolutionNote]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string }
                  status: { type: string }
                  expected: { type: object }
                  observed: { type: object }
                  openedAt: { type: string, format: date-time }
                  resolvedAt: { type: [string, "null"], format: date-time }
                  resolutionNote: { type: [string, "null"] }
    PublicCnftMetadata:
      type: object
      required: [name, symbol, description, attributes, properties]
      properties:
        name: { type: string }
        symbol: { type: string }
        description: { type: string }
        attributes:
          type: array
          items:
            type: object
            required: [trait_type, value]
            properties:
              trait_type: { type: string }
              value: { type: string }
        properties:
          type: object
          required: [network, status, assetId, commitment]
          properties:
            network: { type: string }
            status: { type: string }
            assetId: { type: [string, "null"] }
            commitment:
              type: object
              required: [algorithm, scheme, hash]
              properties:
                algorithm: { type: string, enum: [sha256] }
                scheme: { type: string }
                hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    RwaParty:
      type: object
      required: [id, kind, displayName, jurisdiction, kyc, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [person, organisation] }
        displayName: { type: string }
        jurisdiction: { type: [string, "null"] }
        kyc:
          type: object
          required: [status, reference, verifiedAt, expiresAt]
          properties:
            status: { type: string, enum: [unverified, pending, verified, rejected] }
            reference: { type: [string, "null"] }
            verifiedAt: { type: [string, "null"], format: date-time }
            expiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    RwaPartyDetail:
      allOf:
        - { $ref: "#/components/schemas/RwaParty" }
        - type: object
          required: [wallets, screenings, compliance]
          properties:
            wallets:
              type: array
              items:
                type: object
                required: [id, network, address, screening]
                properties:
                  id: { type: string, format: uuid }
                  network: { type: string }
                  address: { type: string }
                  screening:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [outcome, checkedAt]
                        properties:
                          outcome: { type: string, enum: [clear, review, blocked] }
                          checkedAt: { type: [string, "null"], format: date-time }
            screenings:
              type: array
              items:
                type: object
                required: [id, subject, walletId, provider, providerReference, outcome, reasons, checkedAt]
                properties:
                  id: { type: string, format: uuid }
                  subject: { type: string, enum: [party, wallet] }
                  walletId: { type: [string, "null"], format: uuid }
                  provider: { type: string }
                  providerReference: { type: string }
                  outcome: { type: string, enum: [clear, review, blocked] }
                  reasons: { type: array, items: { type: string } }
                  checkedAt: { type: string, format: date-time }
            compliance:
              type: object
              required: [allowed, reasons]
              properties:
                allowed: { type: boolean }
                reasons: { type: array, items: { type: string } }
    RwaOrder:
      type: object
      required: [id, reconciliationId, kind, partyId, partyName, representationId, shareAmount, settlementNetwork, tokenContract, settlementAmount, tronWallet, solanaWallet, status, approvedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reconciliationId: { type: string, format: uuid }
        kind: { type: string, enum: [subscription, redemption, distribution] }
        partyId: { type: string, format: uuid }
        partyName: { type: string }
        representationId: { type: [string, "null"], format: uuid }
        shareAmount: { type: [string, "null"] }
        settlementNetwork: { type: string }
        tokenContract: { type: string }
        settlementAmount: { type: string }
        tronWallet: { type: [string, "null"] }
        solanaWallet: { type: [string, "null"] }
        status: { type: string, enum: [open, settling, issuing, completed, cancelled, exception] }
        approvedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RwaOrderDetail:
      allOf:
        - { $ref: "#/components/schemas/RwaOrder" }
        - type: object
          required: [issuance, settlement, cases, discrepancies]
          properties:
            issuance:
              type: array
              items:
                type: object
                required: [id, action, amount, holder, status, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  action: { type: string }
                  amount: { type: [string, "null"] }
                  holder: { type: string }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
            settlement:
              type: array
              items:
                type: object
                required: [id, purpose, direction, amount, payer, payee, status, txId, observedAmount, observedBlock, observedAt, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  purpose: { type: string }
                  direction: { type: string, enum: [outbound, inbound] }
                  amount: { type: string }
                  payer: { type: string }
                  payee: { type: string }
                  status: { type: string }
                  txId: { type: [string, "null"] }
                  observedAmount: { type: [string, "null"] }
                  observedBlock: { type: [string, "null"] }
                  observedAt: { type: [string, "null"], format: date-time }
                  createdAt: { type: string, format: date-time }
            cases:
              type: array
              items:
                type: object
                required: [id, kind, status, expected, observed, openedAt, resolvedAt, resolutionNote]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string }
                  status: { type: string }
                  expected: { type: object }
                  observed: { type: object }
                  openedAt: { type: string, format: date-time }
                  resolvedAt: { type: [string, "null"], format: date-time }
                  resolutionNote: { type: [string, "null"] }
            discrepancies: { type: array, items: { type: string } }
    Money:
      type: object
      required: [currency, amount, entries]
      properties:
        currency: { type: string }
        amount: { type: string, description: Decimal as text }
        entries: { type: integer }
    PeriodReport:
      type: object
      required: [from, to, farm, tasks, inputs, harvests, spending, alerts, observations, farms]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        farm:
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        tasks:
          type: object
          required: [completed, due, dueStillOpen, byKind, byPerson]
          properties:
            completed: { type: integer }
            due: { type: integer, description: Tasks due in the period (not cancelled) }
            dueStillOpen: { type: integer }
            byKind:
              type: array
              items:
                type: object
                required: [kind, count]
                properties:
                  kind: { type: string }
                  count: { type: integer }
            byPerson:
              type: array
              items:
                type: object
                required: [userId, name, count]
                properties:
                  userId: { type: [string, "null"], format: uuid }
                  name: { type: [string, "null"] }
                  count: { type: integer }
        inputs:
          type: array
          items:
            type: object
            required: [itemId, name, category, unit, used, applications]
            properties:
              itemId: { type: string, format: uuid }
              name: { type: string }
              category: { type: string }
              unit: { type: string }
              used: { type: string }
              applications: { type: integer }
        harvests:
          type: array
          items:
            type: object
            required: [crop, unit, quantity, batches]
            properties:
              crop: { type: string }
              unit: { type: string }
              quantity: { type: string }
              batches: { type: integer }
        spending:
          type: object
          required: [deliveries, servicing]
          properties:
            deliveries: { type: array, items: { $ref: "#/components/schemas/Money" } }
            servicing: { type: array, items: { $ref: "#/components/schemas/Money" } }
        alerts:
          type: object
          required: [info, warning, critical]
          properties:
            info: { type: integer }
            warning: { type: integer }
            critical: { type: integer }
        observations:
          type: object
          required: [userEntered, sensorReported, providerObservation]
          properties:
            userEntered: { type: integer }
            sensorReported: { type: integer }
            providerObservation: { type: integer }
        farms:
          type: array
          items:
            type: object
            required: [farmId, name, tasksCompleted, applications, harvestBatches, alerts]
            properties:
              farmId: { type: string, format: uuid }
              name: { type: string }
              tasksCompleted: { type: integer }
              applications: { type: integer }
              harvestBatches: { type: integer }
              alerts: { type: integer }
    Me:
      type: object
      required: [userId, tenants]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        tenants:
          type: array
          items:
            type: object
            required: [tenantId, slug, name, role]
            properties:
              tenantId: { type: string, format: uuid }
              slug: { type: string }
              name: { type: string }
              role: { $ref: "#/components/schemas/Role" }

    LonLat:
      type: object
      required: [lon, lat]
      properties:
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -90, maximum: 90 }

    CreateFarm:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        origin: { $ref: "#/components/schemas/LonLat" }
        timezone: { type: string, default: UTC }

    Farm:
      type: object
      required: [id, name, timezone, origin, originProvenance, currentBoundaryVersionId, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        timezone: { type: string }
        origin:
          oneOf:
            - { $ref: "#/components/schemas/LonLat" }
            - { type: "null" }
        originProvenance: { $ref: "#/components/schemas/ProvenanceLabel" }
        currentBoundaryVersionId: { type: [string, "null"], format: uuid }
        outline:
          description: Simplified outer ring of the current boundary as [lon, lat] pairs, for drawing small outlines. Not for measurement.
          type: [array, "null"]
          items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        boundaryAreaM2: { type: [number, "null"], description: Geodesic area of the current boundary in m² (estimate from the submitted shape). }
        archivedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, role, displayName, email, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        displayName: { type: [string, "null"], description: Self-reported by the member. }
        email: { type: [string, "null"], description: Self-reported by the member; not verified. }
        joinedAt: { type: string, format: date-time }

    Invitation:
      type: object
      required: [id, email, role, invitedBy, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invitedBy: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    SubmitBoundary:
      type: object
      required: [geojson, source]
      properties:
        geojson:
          description: GeoJSON Polygon/MultiPolygon/Feature/FeatureCollection (one feature). WGS 84 lon/lat.
          type: object
          additionalProperties: true
        source: { type: string, enum: [drawn, imported, coordinates] }
        note: { type: string, maxLength: 1000 }

    GeometryIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_STRUCTURE
            - UNSUPPORTED_GEOMETRY_TYPE
            - UNSUPPORTED_CRS
            - INPUT_TOO_DEEP
            - INVALID_COORDINATE
            - RING_NOT_CLOSED
            - RING_TOO_FEW_POSITIONS
            - RING_DEGENERATE
            - TOO_MANY_VERTICES
            - TOO_MANY_RINGS
            - TOO_MANY_POLYGONS
            - SELF_INTERSECTION
            - RINGS_INTERSECT
            - HOLE_OUTSIDE_SHELL
            - ANTIMERIDIAN_CROSSING
            - AREA_TOO_SMALL
            - AREA_TOO_LARGE
            - DUPLICATE_GEOMETRY
            - POSTGIS_INVALID
        message: { type: string }
        path: { type: array, items: { type: integer } }

    GeometryRejected:
      type: object
      required: [error, message, issues]
      properties:
        error: { type: string, enum: [geometry_rejected, duplicate_geometry] }
        message: { type: string }
        issues: { type: array, items: { $ref: "#/components/schemas/GeometryIssue" } }

    BoundaryVersion:
      type: object
      required: [id, farmId, version, geojson, crs, source, provenance, areaM2, vertexCount, validationStatus, validationIssues, submittedAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        version: { type: integer }
        geojson: { type: object, additionalProperties: true, description: GeoJSON MultiPolygon }
        crs: { type: string, enum: ["OGC:CRS84"] }
        source: { type: string, enum: [drawn, imported, coordinates] }
        provenance:
          type: string
          enum: [user-entered, independently-verified]
        areaM2: { type: number, description: Geodesic area computed from the submitted geometry; not a survey. }
        vertexCount: { type: integer }
        validationStatus: { type: string, enum: [pending, valid, invalid] }
        validationIssues: { type: array, items: { $ref: "#/components/schemas/GeometryIssue" } }
        overlaps:
          type: array
          items:
            type: object
            required: [farmId, overlapM2]
            properties:
              farmId: { type: string, format: uuid }
              overlapM2: { type: number }
        note: { type: [string, "null"] }
        submittedAt: { type: string, format: date-time }
        validatedAt: { type: [string, "null"], format: date-time }

    PlanParcel:
      type: object
      required: [label, grid]
      properties:
        label: { type: string, maxLength: 80 }
        cropName: { type: string, maxLength: 120 }
        grid:
          type: object
          required: [rows, cols, spacingM]
          properties:
            rows: { type: integer, minimum: 1, maximum: 500 }
            cols: { type: integer, minimum: 1, maximum: 500 }
            spacingM: { type: number, exclusiveMinimum: 0, maximum: 50 }
        assetCatalogId: { type: string, format: uuid }

    FarmPlanInput:
      type: object
      required: [name, parcels]
      properties:
        name: { type: string, maxLength: 120 }
        season: { type: string, maxLength: 64 }
        parcels: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/PlanParcel" } }

    FarmPlan:
      allOf:
        - { $ref: "#/components/schemas/FarmPlanInput" }
        - type: object
          required: [id, farmId, provenance, createdAt]
          properties:
            id: { type: string, format: uuid }
            farmId: { type: string, format: uuid }
            provenance: { type: string, enum: [user-entered] }
            createdAt: { type: string, format: date-time }

    ScenarioRange:
      type: object
      required: [low, base, high]
      properties:
        low: { type: number, minimum: 0 }
        base: { type: number, minimum: 0 }
        high: { type: number, minimum: 0 }

    CropScenarioInput:
      type: object
      required: [cropName, yieldPerHa, yieldUnit, pricePerUnit, costs, currency]
      properties:
        cropName: { type: string, maxLength: 120 }
        plantedAreaHa: { type: number, exclusiveMinimum: 0, description: Defaults to the current boundary area. }
        yieldPerHa: { $ref: "#/components/schemas/ScenarioRange" }
        yieldUnit: { type: string, maxLength: 32 }
        pricePerUnit: { $ref: "#/components/schemas/ScenarioRange" }
        costs: { $ref: "#/components/schemas/ScenarioRange" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        assumptionsNote: { type: string, maxLength: 2000 }

    ScenarioCase:
      type: object
      required: [production, grossRevenue, costs, net]
      properties:
        production: { type: number }
        grossRevenue: { type: number }
        costs: { type: number }
        net: { type: number }

    CropScenario:
      type: object
      required: [id, farmId, kind, input, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        kind: { type: string, enum: [simulated] }
        input: { $ref: "#/components/schemas/CropScenarioInput" }
        result:
          type: object
          required: [kind, provenance, disclaimer, currency, yieldUnit, cases]
          properties:
            kind: { type: string, enum: [simulated] }
            provenance: { type: string, enum: [user-entered] }
            disclaimer: { type: string }
            currency: { type: string }
            yieldUnit: { type: string }
            cases:
              type: object
              required: [low, base, high]
              properties:
                low: { $ref: "#/components/schemas/ScenarioCase" }
                base: { $ref: "#/components/schemas/ScenarioCase" }
                high: { $ref: "#/components/schemas/ScenarioCase" }
        createdAt: { type: string, format: date-time }

    Asset:
      type: object
      required: [id, kind, name, license, provenance]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [plant, equipment, structure, decoration] }
        name: { type: string }
        description: { type: [string, "null"] }
        procedural: { type: [object, "null"], additionalProperties: true }
        modelMediaId: { type: [string, "null"], format: uuid }
        license: { type: string }
        provenance: { type: string, enum: [illustrative] }
        scope: { type: string, enum: [global, tenant] }

    SceneEntity:
      type: object
      required: [id, kind, assetId, x, z, rotation, scale, provenance]
      properties:
        id: { type: string, description: Stable entity id (unchanged across reloads for the same plan). }
        kind: { type: string, enum: [plant, equipment, structure, decoration, sensor] }
        assetId: { type: string }
        label: { type: string }
        x: { type: number, description: Metres east of origin }
        z: { type: number, description: Metres south of origin (three.js convention) }
        rotation: { type: number }
        scale: { type: number }
