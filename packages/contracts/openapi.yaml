openapi: 3.1.0
info:
  title: Metafarm API
  version: 0.1.0
  summary: Multi-tenant farm planning API.
  description: |
    All tenant-scoped routes live under `/v1/tenants/{tenantId}` and require the
    caller to hold a membership in that tenant. Requests for another tenant's
    resources return `404` (not `403`) so resource existence is not disclosed.

    **Idempotency.** Any write (POST, PUT, PATCH, DELETE) under `/v1/tenants/{tenantId}`
    accepts an `Idempotency-Key` header (a UUID), scoped to the tenant and the signed-in
    user and kept for 24 hours. A resend with the same key and the same request returns
    the stored response with `Idempotent-Replayed: true` and does not write again. A
    different request under a used key is refused with `409 idempotency_key_reused`, and a
    resend while the first request has not finished, or whose outcome was not recorded,
    with `409 idempotency_request_in_progress`. A failed request (non-2xx) frees its key.
    Routes that document their own idempotent result (for example a `200` "resend") keep
    that behaviour.

    **Provenance.** Every boundary, observation, plan and scene element carries a
    `provenance` label: `illustrative`, `user-entered`, `provider-observation`,
    `sensor-reported`, or `independently-verified` (only with evidence).

    **Scenarios** are simulations computed from user-entered figures. They are not
    forecasts and not realised income.

    **NFTs** are digital collectibles or in-app utility only. They do not convey
    land title, crop ownership, profit share or any promise of value.
  license:
    name: Proprietary
servers:
  - url: http://localhost:4000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: health
  - name: identity
  - name: farms
  - name: boundaries
  - name: planning
  - name: assets
  - name: observations
  - name: alerts
  - name: tasks
  - name: harvests
  - name: inventory
  - name: seasons
  - name: equipment
  - name: sensors
  - name: notifications
  - name: exports
  - name: reports
  - name: rwa
  - name: yield
    description: Real-yield distribution, operator views (read-only; simulation-labelled cycles; nothing is funded, signed or submitted)
  - name: twin
    description: Digital twin for a separate 3D client (read-mostly; no transaction is ever submitted)
  - name: media
  - name: team
  - name: audit
  - name: wallet
  - name: nft
  - name: webhooks

paths:
  /healthz:
    get:
      tags: [health]
      security: []
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /readyz:
    get:
      tags: [health]
      security: []
      summary: Readiness probe (database and queue reachable)
      operationId: getReadiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /metrics:
    get:
      tags: [health]
      security: [{ metricsToken: [] }]
      summary: Metrics in the Prometheus text format (off unless METRICS_TOKEN is set)
      description: |
        Request counts and timings per route template, and nothing tenant-specific. Answers 404 when
        METRICS_TOKEN is not configured, and 401 without `Authorization: Bearer <METRICS_TOKEN>`.
        The metric names are listed in docs/observability.md.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me:
    get:
      tags: [identity]
      summary: Current user and tenant memberships
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/invitations/accept:
    post:
      tags: [team]
      summary: Accept an invitation with its token and join the workspace
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        "200":
          description: Joined (or already a member)
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, name, role, alreadyMember]
                properties:
                  tenantId: { type: string, format: uuid }
                  name: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  alreadyMember: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/BadRequest" }

  /v1/me/profile:
    patch:
      tags: [identity]
      summary: Set the name and email other members see (self-reported)
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: [string, "null"], maxLength: 120 }
                email: { type: [string, "null"], format: email, maxLength: 320 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [displayName, email]
                properties:
                  displayName: { type: [string, "null"] }
                  email: { type: [string, "null"] }

  /v1/me/workspaces:
    post:
      tags: [identity]
      summary: Create a workspace and become its owner (self-service; may be disabled by the operator)
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, slug, name, role]
                properties:
                  tenantId: { type: string, format: uuid }
                  slug: { type: string }
                  name: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/farms:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [farms]
      summary: List farms
      operationId: listFarms
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { type: string, enum: [active, archived], default: active } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Farm" } }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [farms]
      summary: Create a farm project
      operationId: createFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFarm" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/farms/{farmId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [farms]
      summary: Get a farm
      operationId: getFarm
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [farms]
      summary: Update a farm's name, description or time zone
      operationId: updateFarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, "null"], maxLength: 2000 }
                timezone: { type: string, description: "IANA time zone, e.g. Asia/Tehran" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/archive:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    post:
      tags: [farms]
      summary: Archive a farm (hidden from the default list; data is kept)
      operationId: archiveFarm
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/restore:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    post:
      tags: [farms]
      summary: Restore an archived farm
      operationId: restoreFarm
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/media:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [media]
      summary: List confirmed files attached to a farm
      operationId: listFarmMedia
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [boundary-import, observation-photo, verification-evidence, asset-model] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/MediaObject" }
                        - type: object
                          properties:
                            uploadedBy: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/media/{mediaId}/content:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [media]
      summary: Download a confirmed file (members of the workspace only)
      operationId: getMediaContent
      responses:
        "200":
          description: The file bytes, with its stored content type
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/settings:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    patch:
      tags: [team]
      summary: Rename the workspace (admin/owner)
      operationId: updateWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, slug, name]
                properties:
                  tenantId: { type: string, format: uuid }
                  slug: { type: string }
                  name: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/members:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [team]
      summary: List workspace members
      operationId: listMembers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Member" } }

  /v1/tenants/{tenantId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [team]
      summary: Change a member's role (only owners can grant or change the owner role; the last owner cannot be demoted)
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [userId, role]
                properties:
                  userId: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [team]
      summary: Remove a member, or leave the workspace when userId is yourself
      operationId: removeMember
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/invitations:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [team]
      summary: List pending invitations (admin/owner)
      operationId: listInvitations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
    post:
      tags: [team]
      summary: Create a single-use invitation link (valid 7 days). The token is returned once; nothing is emailed.
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Invitation" }
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/invitations/{invitationId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [team]
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/boundaries:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [boundaries]
      summary: List boundary versions
      operationId: listBoundaries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BoundaryVersion" } }
    post:
      tags: [boundaries]
      summary: Submit a boundary
      description: |
        Accepts a GeoJSON Polygon, MultiPolygon, Feature or single-feature
        FeatureCollection in WGS 84 lon/lat. The geometry is pre-validated
        synchronously; authoritative PostGIS validation runs as a background job.
        The new version is labelled `user-entered`.
      operationId: submitBoundary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitBoundary" }
      responses:
        "202":
          description: Accepted; validation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoundaryVersion" }
        "409":
          description: Identical boundary already exists in this tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeometryRejected" }
        "422":
          description: Geometry rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeometryRejected" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/boundaries/{boundaryId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: boundaryId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [boundaries]
      summary: Get a boundary version and its validation status
      operationId: getBoundary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoundaryVersion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/boundaries/{boundaryId}/evidence:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: boundaryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [boundaries]
      summary: Attach verification evidence (verifier role)
      description: |
        Attaches an uploaded `verification-evidence` document and marks the
        boundary `independently-verified`. Without evidence the label cannot be set;
        the database enforces this independently of the API.
      operationId: addBoundaryEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, mediaObjectId]
              properties:
                kind: { type: string, enum: [survey-document, registry-extract, field-inspection, other] }
                mediaObjectId: { type: string, format: uuid }
                note: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoundaryVersion" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/farms/{farmId}/plan:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [planning]
      summary: Get the latest farm plan
      operationId: getFarmPlan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmPlan" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [planning]
      summary: Save a farm plan (creates a new revision)
      operationId: putFarmPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmPlanInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/farms/{farmId}/scenarios:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [planning]
      summary: List crop scenarios
      operationId: listScenarios
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CropScenario" } }
    post:
      tags: [planning]
      summary: Run and store a simulated crop scenario
      description: Computes low/base/high cases from user-entered figures only. Output is always `kind = simulated`.
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CropScenarioInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CropScenario" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/farms/{farmId}/scene:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [assets]
      summary: Deterministic scene description for the 3D view
      description: Positions are metres in a local east-north frame centred on the farm origin. All scene elements are illustrative.
      operationId: getScene
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneDescription" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/assets:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [assets]
      summary: Asset catalogue (global + tenant)
      operationId: listAssets
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [plant, equipment, structure, decoration] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Asset" } }

  /v1/tenants/{tenantId}/farms/{farmId}/observations:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [observations]
      summary: List normalised observations
      operationId: listObservations
      parameters:
        - { name: metric, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Observation" } }
    post:
      tags: [observations]
      summary: Record an observation (queued for normalisation)
      operationId: createObservation
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObservationInput" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [rawObservationId, provenance]
                properties:
                  rawObservationId: { type: string, format: uuid }
                  provenance: { $ref: "#/components/schemas/ProvenanceLabel" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/farms/{farmId}/alerts:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [alerts]
      summary: List alerts
      operationId: listAlerts
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, acknowledged, resolved] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Alert" } }

  /v1/tenants/{tenantId}/farms/{farmId}/alerts/{alertId}/ack:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: alertId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [alerts]
      summary: Acknowledge an alert
      operationId: ackAlert
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/tasks:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [tasks]
      summary: Tasks across all active farms (my tasks, team schedule)
      description: Date ranges are limited to 92 days. Dates are calendar days in each farm's time zone.
      operationId: listWorkspaceTasks
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, done, cancelled, all], default: open }, description: "open = todo and in_progress" }
        - { name: assignee, in: query, schema: { type: string }, description: '"me" or a user id' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: includeOverdue, in: query, schema: { type: string, enum: ["true", "false"] }, description: "With a date range, also return open tasks due before `from`." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Task" } }

  /v1/tenants/{tenantId}/farms/{farmId}/tasks:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [tasks]
      summary: List a farm's tasks
      operationId: listFarmTasks
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, done, cancelled, all], default: open }, description: "open = todo and in_progress" }
        - { name: assignee, in: query, schema: { type: string }, description: '"me" or a user id' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: includeOverdue, in: query, schema: { type: string, enum: ["true", "false"] }, description: "With a date range, also return open tasks due before `from`." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Task" } }
    post:
      tags: [tasks]
      summary: Create a task (task:manage)
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/farms/{farmId}/tasks/{taskId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [tasks]
      summary: Change a task
      description: |
        Managers may change any field. A field worker may only set `status` to
        `todo` or `in_progress` on a task assigned to them; starting an unassigned
        task assigns it to them.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The task is already completed }

  /v1/tenants/{tenantId}/farms/{farmId}/tasks/{taskId}/complete:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      summary: Complete a task
      description: Repeating tasks create their next occurrence, kept on the original rhythm.
      operationId: completeTask
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCompletion" }
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                type: object
                required: [task, next]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
                  next:
                    oneOf:
                      - { $ref: "#/components/schemas/Task" }
                      - { type: "null" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already completed or cancelled }

  /v1/tenants/{tenantId}/farms/{farmId}/harvests:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [harvests]
      summary: List harvest batches
      operationId: listHarvests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Harvest" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [harvests]
      summary: Record a harvest batch (harvest:record)
      description: |
        Builds the batch's public record and its SHA-256 fingerprint. When the
        harvest registry is configured, the fingerprint is registered on-chain
        by a background job. The record can never be edited; void it instead.
      operationId: recordHarvest
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HarvestInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Harvest" }
        "200":
          description: Already recorded with this Idempotency-Key (a resend); the original batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Harvest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/farms/{farmId}/harvests/{batchId}/void:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [harvests]
      summary: Void a harvest batch (harvest:manage)
      operationId: voidHarvest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: Voided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Harvest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already void }

  /v1/tenants/{tenantId}/farms/{farmId}/harvests/{batchId}/anchor:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [harvests]
      summary: Retry the on-chain registration of a batch (harvest:manage)
      operationId: retryHarvestAnchor
      responses:
        "200":
          description: Registration queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Harvest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already registered, in progress, or registration is not configured" }

  /v1/public/harvests/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string, pattern: "^[2-9A-HJKMNP-Z]{10}$" } }
    get:
      tags: [harvests]
      security: []
      summary: Public traceability record of a batch (no sign-in)
      description: |
        For buyers scanning a label. Returns only the public record, its
        fingerprint and registration details, plus a live check against the
        registry contract when the server can reach the chain.
      operationId: getPublicHarvest
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicHarvest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/public/rwa/cnft/{representationId}:
    parameters:
      - { name: representationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rwa]
      security: []
      summary: Public metadata of a compressed NFT (what its on-chain URI points at)
      description: Name, symbol, asset kind and the salted commitment to the asset record. Never coordinates or the salt.
      operationId: getPublicCnftMetadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCnftMetadata" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/inventory/items:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [inventory]
      summary: Input items with stock on hand
      operationId: listInputItems
      parameters:
        - { name: includeArchived, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InputItem" } }
    post:
      tags: [inventory]
      summary: Add an input item (inventory:manage)
      operationId: createInputItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InputItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InputItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: An item with this name exists }

  /v1/tenants/{tenantId}/inventory/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [inventory]
      summary: Change or archive an input item (inventory:manage)
      operationId: updateInputItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InputItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InputItem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/inventory/movements:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [inventory]
      summary: Stock movements (deliveries, use, corrections)
      operationId: listStockMovements
      parameters:
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: farmId, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string, enum: [receive, use, adjust] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }
    post:
      tags: [inventory]
      summary: Record a delivery, use or stock correction
      description: "`use` needs inventory:use; `receive` and `adjust` need inventory:manage. The log is append-only."
      operationId: recordStockMovement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockMovementInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [movement, item]
                properties:
                  movement: { $ref: "#/components/schemas/StockMovement" }
                  item: { $ref: "#/components/schemas/InputItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/farms/{farmId}/phi:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [inventory]
      summary: Pre-harvest intervals still running on a parcel on a given day
      operationId: listPhiRestrictions
      parameters:
        - { name: parcel, in: query, schema: { type: string, maxLength: 80 } }
        - { name: "on", in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PhiRestriction" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/seasons:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
