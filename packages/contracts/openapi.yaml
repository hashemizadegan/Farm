        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EquipmentSummary" } }
    post:
      tags: [equipment]
      summary: Add a machine (equipment:manage)
      operationId: createEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentInput" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A machine with this name exists }

  /v1/tenants/{tenantId}/equipment/{equipmentId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [equipment]
      summary: A machine with maintenance plans, readings and service log
      operationId: getEquipment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquipmentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [equipment]
      summary: Change a machine, its status or farm (equipment:manage)
      operationId: updateEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/equipment/{equipmentId}/readings:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
