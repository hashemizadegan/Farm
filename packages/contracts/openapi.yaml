      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InputItem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/inventory/movements:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [inventory]
      summary: Stock movements (deliveries, use, corrections)
      operationId: listStockMovements
      parameters:
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: farmId, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string, enum: [receive, use, adjust] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }
    post:
      tags: [inventory]
      summary: Record a delivery, use or stock correction
      description: "`use` needs inventory:use; `receive` and `adjust` need inventory:manage. The log is append-only."
      operationId: recordStockMovement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockMovementInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [movement, item]
                properties:
                  movement: { $ref: "#/components/schemas/StockMovement" }
                  item: { $ref: "#/components/schemas/InputItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/farms/{farmId}/phi:
