    patch:
      tags: [sensors]
      summary: Rename, move, disable or change the silence allowance (sensor:manage)
      operationId: updateSensor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensorUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sensor" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/sensors/{sensorId}/rotate:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: sensorId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [sensors]
      summary: Issue a new device token; the old one stops working (sensor:manage)
      operationId: rotateSensorToken
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorWithToken" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ingest/readings:
    post:
      tags: [sensors]
      security: []
      summary: Readings from a device (Authorization "Sensor <token>")
      description: |
        Devices send up to 200 numeric readings per request over HTTPS, with
        `Authorization: Sensor <token>`. Readings are normalised like any other
        observation and labelled `sensor-reported`.
      operationId: ingestReadings
      parameters:
        - { name: authorization, in: header, required: true, schema: { type: string, pattern: "^Sensor mfs_" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestReadings" }
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/tenants/{tenantId}/farms/{farmId}/alert-rules:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [alerts]
      summary: Alert rules of a farm
      operationId: listAlertRules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: 
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
    post:
      tags: [alerts]
      summary: Add an alert rule (sensor:manage)
      operationId: createAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/farms/{farmId}/alert-rules/{ruleId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [alerts]
      summary: Turn an alert rule on or off (sensor:manage)
      operationId: updateAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/notifications:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [notifications]
      summary: Your notifications in this workspace, newest first
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unread, items]
                properties:
                  unread: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }

  /v1/tenants/{tenantId}/notifications/read:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [notifications]
      summary: Mark notifications read
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [all]
                  properties:
                    all: { type: boolean, enum: [true] }
                - type: object
                  additionalProperties: false
                  required: [ids]
                  properties:
                    ids: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked: { type: integer }

  /v1/tenants/{tenantId}/exports/{dataset}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: dataset, in: path, required: true, schema: { type: string, enum: [input-log, harvests, tasks, stock] } }
    get:
      tags: [exports]
      summary: Download records as a spreadsheet (CSV)
      description: |
        input-log is every recorded use of an input (the spray and fertiliser log); harvests
        include their fingerprints and registry status; stock is a snapshot and takes no farm
        or dates. Values are machine-readable (ISO dates, Latin digits); `lang` sets only the
        column headings. UTF-8 with a byte-order mark.
      operationId: downloadExport
      parameters:
        - { name: farmId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: lang, in: query, schema: { type: string, enum: [en, fa], default: en } }
      responses:
        "200":
          description: The file
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Too many rows; choose a shorter range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/reports/summary:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [reports]
      summary: What the team recorded in a period (whole workspace or one farm)
      description: |
        Days are read in each farm's own time zone. Nothing is estimated - spending is only what
        was entered as a cost, per currency; quantities stay per unit. Deliveries recorded without
        a farm appear only in the workspace report.
      operationId: getPeriodReport
      parameters:
        - { name: farmId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/parties:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: Investors (parties)
      operationId: listRwaParties
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RwaParty" } }
    post:
      tags: [rwa]
      summary: Register an investor
      operationId: createRwaParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, displayName]
              properties:
                kind: { type: string, enum: [person, organisation] }
                displayName: { type: string, minLength: 1, maxLength: 200 }
                jurisdiction: { type: [string, "null"], pattern: "^[A-Za-z]{2}$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rwa]
      summary: An investor with wallets, screenings and the current compliance decision
      operationId: getRwaParty
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}/kyc:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Record the KYC outcome from the provider's case
      operationId: recordRwaKyc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [unverified, pending, verified, rejected] }
                reference: { type: [string, "null"], description: "Provider case reference; required for verified" }
                expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}/wallets:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Register a wallet of the investor
      operationId: addRwaWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [network, address]
              properties:
                network: { type: string, enum: [solana-devnet, solana-mainnet, tron-nile, tron-shasta, tron-mainnet] }
                address: { type: string }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The address is already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}/screenings:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Record a sanctions screening of the investor or one of their wallets
      description: Screenings come from a real provider (named, with its reference). The log is append-only.
      operationId: recordRwaScreening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, providerReference, outcome, checkedAt]
              properties:
                walletId: { type: string, format: uuid }
                provider: { type: string }
                providerReference: { type: string }
                outcome: { type: string, enum: [clear, review, blocked] }
                reasons: { type: array, items: { type: string } }
                checkedAt: { type: string, format: date-time }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/assets:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: Real-world assets and their share tokens
      operationId: listRwaAssets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RwaAsset" } }
    post:
      tags: [rwa]
      summary: Register a real-world asset (draft until a second person verifies it)
      operationId: createRwaAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [farmId, kind, name]
              properties:
                farmId: { type: string, format: uuid }
                kind: { type: string, enum: [parcel, tree, livestock, equipment, harvest_lot, farm_share] }
                name: { type: string, minLength: 1, maxLength: 200 }
                externalRef: { type: string }
                parcelLabel: { type: string }
                geometry: { type: object, description: "GeoJSON Point or Polygon (WGS 84)" }
                geomProvenance: { type: string, enum: [surveyed, gnss, user-entered] }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaAsset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/assets/{assetId}/verify:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Verify an asset (someone other than who registered it)
      description: Parcels and trees need geometry, and geometry must lie within the farm's current boundary.
      operationId: verifyRwaAsset
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaAsset" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not a draft, missing geometry, or outside the farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/assets/{assetId}/representations:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Plan a Token-2022 share token for a verified asset
      operationId: createRwaRepresentation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [network, decimals]
              properties:
                network: { type: string, enum: [solana-devnet, solana-mainnet] }
                decimals: { type: integer, minimum: 0, maximum: 9 }
      responses:
        "201":
          description: Planned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaAsset" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Asset not verified, or already has a share token on that network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/assets/{assetId}/registrations:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Register a verified parcel, tree or animal as a compressed NFT held by a custodian
      description: |
        Fixes the leaf's metadata (name, symbol and a URI to its public document, which commits to
        the asset record by a salted SHA-256; no coordinates go on chain) and opens a registration
        that a second person must approve before anything is minted. The custodian must pass the
        compliance gate with the given, screened Solana wallet.
      operationId: createRwaRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [network, partyId, solanaWallet]
              properties:
                network: { type: string, enum: [solana-devnet, solana-mainnet] }
                partyId: { type: string, format: uuid }
                solanaWallet: { type: string, minLength: 32, maxLength: 44 }
      responses:
        "201":
          description: Registered; waiting for approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaRegistration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not a parcel, tree or animal; not verified; or already registered on that network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Compliance checks failed, or the metadata does not fit the program's limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Registrations not configured (RWA_CNFT_METADATA_BASE_URL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/registrations:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: Registrations and the state of their compressed NFTs
      operationId: listRwaRegistrations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RwaRegistration" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/rwa/registrations/{registrationId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: registrationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rwa]
      summary: A registration with its reconciliation cases
      operationId: getRwaRegistration
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaRegistrationDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/registrations/{registrationId}/approve:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: registrationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Approve a registration's mint (someone other than who registered it)
      description: The platform creates the Merkle tree if needed, then mints the leaf to the custodian. Compliance is checked again now and again at signing.
      operationId: approveRwaRegistration
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaRegistration" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Compliance checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/representations/{representationId}/mint:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: representationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Link an existing Token-2022 mint, checked on chain
      description: The platform's Solana RPC must first prove (getGenesisHash) that it serves RWA_SOLANA_NETWORK. The account must then be an initialised Token-2022 mint whose mint authority is the platform's issuer (RWA_SOLANA_ISSUER).
      operationId: linkRwaMint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mintAddress]
              properties:
                mintAddress: { type: string }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaAsset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already linked, wrong network, or mint used elsewhere
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Not a Token-2022 mint controlled by the platform's issuer, or the platform's RPC serves another cluster (solana_cluster_mismatch)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Issuance not configured, or the platform's RPC could not be verified (solana_rpc_unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/orders:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: Orders
      operationId: listRwaOrders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RwaOrder" } }
    post:
      tags: [rwa]
      summary: Place an order (passes the compliance gate)
      description: |
        Refused with 422 compliance_blocked (reasons in details) unless the investor's KYC is
        verified and current, the jurisdiction is known and permitted, and the investor and both
        wallets have clear, recent screenings. Mainnets are refused unless enabled.
      operationId: createRwaOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, partyId, settlementNetwork, tokenContract, settlementAmount, tronWallet]
              properties:
                kind: { type: string, enum: [subscription, redemption, distribution] }
                partyId: { type: string, format: uuid }
                representationId: { type: string, format: uuid }
                shareAmount: { type: string, description: Base units }
                settlementNetwork: { type: string, enum: [tron-nile, tron-shasta, tron-mainnet] }
                tokenContract: { type: string }
                settlementAmount: { type: string, description: Base units }
                tronWallet: { type: string }
                solanaWallet: { type: string }
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Compliance checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/orders/{orderId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rwa]
      summary: An order with its intents on both rails and its reconciliation cases
      operationId: getRwaOrder
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/orders/{orderId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Cancel an order with nothing done yet
      operationId: cancelRwaOrder
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The order is already under way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/orders/{orderId}/approve:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Approve a redemption or distribution (someone other than who placed it)
      description: Only approved orders burn shares or pay out of the treasury. Compliance is checked again now and again at signing.
      operationId: approveRwaOrder
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not open, or a subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Compliance checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/orders/{orderId}/payments:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Record the investor's subscription payment, verified on chain
      description: |
        The TRON transaction must be solidified and be exactly the expected TRC-20 transfer
        (token, investor wallet, treasury, amount) with a successful receipt and the token's
        Transfer event. A payment can count for one order only. Repeating the call with the same
        transaction returns the order.
      operationId: recordRwaPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [txId]
              properties:
                txId: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Order not open, not a subscription, or payment already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Payment not verified, or compliance checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: TRON payment checks are not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/uploads:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [media]
      summary: Request a signed upload URL
      description: |
        Returns a short-lived pre-signed PUT URL. The client uploads directly to
        object storage, then calls `/complete`. The API never proxies file bytes.
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/uploads/{mediaId}/content:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [media]
      summary: Upload file bytes through the API (only when the server runs with UPLOAD_MODE=proxy)
      description: >-
        In proxy mode the uploadUrl returned by createUpload points here. Send the
        bytes with the declared content type and the same bearer token; the size
        and SHA-256 must match what was declared. Then call completeUpload.
      operationId: putUploadContent
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
          application/geo+json: { schema: { type: string, format: binary } }
          model/gltf-binary: { schema: { type: string, format: binary } }
      responses:
        "204": { description: Stored }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/uploads/{mediaId}/complete:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [media]
      summary: Confirm an upload (size and content type are checked against the stored object)
      operationId: completeUpload
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaObject" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/audit-events:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [audit]
      summary: List audit events (admin/owner)
      operationId: listAuditEvents
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: before, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/nft/metadata/validate:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [nft]
      summary: Validate NFT metadata against schema and content rules
      operationId: validateNftMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NftMetadata" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid: { type: boolean }
                  issues:
                    type: array
                    items:
                      type: object
                      required: [field, message]
                      properties:
                        field: { type: string }
                        message: { type: string }

  /v1/wallet/nonce:
    post:
      tags: [wallet]
      summary: Issue a single-use sign-in nonce and the exact message to sign
      operationId: createWalletNonce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, chainId]
              properties:
                address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
                chainId: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [nonce, message, expiresAt]
                properties:
                  nonce: { type: string }
                  message: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/wallet/verify:
    post:
      tags: [wallet]
      summary: Verify a signed message and link the wallet to the current user
      operationId: verifyWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, signature]
              properties:
                message: { type: string, maxLength: 2000 }
                signature: { type: string, pattern: "^0x[0-9a-fA-F]{130}$" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                type: object
                required: [address, chainId]
                properties:
                  address: { type: string }
                  chainId: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
    post:
      tags: [webhooks]
      security: []
      summary: Receive a signed provider webhook
      description: Requires `x-webhook-signature` (`t=<unix>,v1=<hex HMAC-SHA256 of "t.body">`) and an `id` in the body for de-duplication.
      operationId: receiveWebhook
      parameters:
        - name: x-webhook-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id: { type: string, maxLength: 200 }
                type: { type: string, maxLength: 100 }
                data: { type: object, additionalProperties: true }
      responses:
        "202": { description: Accepted }
        "200": { description: Duplicate delivery ignored }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A UUID chosen by the client. Phones working offline queue writes and resend them; a
        resend with the same key returns the original result instead of recording twice.
        Reusing a key for a different request is a 409.
      schema: { type: string, format: uuid }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FarmId:
      name: farmId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (also returned for resources in other tenants)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: {}

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, draining] }

    HealthReport:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }

    ProvenanceLabel:
      type: string
      enum: [illustrative, user-entered, provider-observation, sensor-reported, independently-verified]

    Role:
      type: string
      enum: [owner, admin, manager, verifier, worker, viewer]

    RwaAsset:
      type: object
      required: [id, farmId, farmName, kind, name, externalRef, parcelLabel, geometry, geomProvenance, status, verifiedAt, createdAt, representations]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        kind: { type: string }
        name: { type: string }
        externalRef: { type: [string, "null"] }
        parcelLabel: { type: [string, "null"] }
        geometry: { type: [object, "null"] }
        geomProvenance: { type: [string, "null"] }
        status: { type: string, enum: [draft, verified, active, suspended, retired] }
        verifiedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        representations:
          type: array
          items:
            type: object
            required: [id, rail, network, status, mintAddress, decimals, createdAt]
            properties:
              id: { type: string, format: uuid }
              rail: { type: string }
              network: { type: string }
              status: { type: string }
              mintAddress: { type: [string, "null"] }
              decimals: { type: [integer, "null"] }
              createdAt: { type: string, format: date-time }
    RwaRegistration:
      type: object
      required: [id, reconciliationId, status, asset, custodian, network, leaf, approvedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reconciliationId: { type: string, format: uuid }
        status: { type: string, enum: [open, settling, issuing, completed, cancelled, exception] }
        asset:
          type: object
          required: [id, name, kind]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { type: string, enum: [parcel, tree, livestock] }
        custodian:
          type: object
          required: [partyId, name, solanaWallet]
          properties:
            partyId: { type: string, format: uuid }
            name: { type: string }
            solanaWallet: { type: string }
        network: { type: string, enum: [solana-devnet, solana-mainnet] }
        leaf:
          type: object
          required: [representationId, status, tree, leafIndex, assetId, leafHash, metadataUri]
          properties:
            representationId: { type: string, format: uuid }
            status: { type: string, enum: [planned, issuing, active, frozen, retired] }
            tree: { type: [string, "null"], description: Merkle tree address once the mint is prepared }
            leafIndex: { type: [string, "null"] }
            assetId: { type: [string, "null"], description: DAS asset id }
            leafHash: { type: [string, "null"] }
            metadataUri: { type: string, format: uri }
        approvedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RwaRegistrationDetail:
      allOf:
        - { $ref: "#/components/schemas/RwaRegistration" }
        - type: object
          required: [cases]
          properties:
            cases:
              type: array
              items:
                type: object
                required: [id, kind, status, expected, observed, openedAt, resolvedAt, resolutionNote]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string }
                  status: { type: string }
                  expected: { type: object }
                  observed: { type: object }
                  openedAt: { type: string, format: date-time }
                  resolvedAt: { type: [string, "null"], format: date-time }
                  resolutionNote: { type: [string, "null"] }
    PublicCnftMetadata:
      type: object
      required: [name, symbol, description, attributes, properties]
      properties:
        name: { type: string }
        symbol: { type: string }
        description: { type: string }
        attributes:
          type: array
          items:
            type: object
            required: [trait_type, value]
            properties:
              trait_type: { type: string }
              value: { type: string }
        properties:
          type: object
          required: [network, status, assetId, commitment]
          properties:
            network: { type: string }
            status: { type: string }
            assetId: { type: [string, "null"] }
            commitment:
              type: object
              required: [algorithm, scheme, hash]
              properties:
                algorithm: { type: string, enum: [sha256] }
                scheme: { type: string }
                hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    RwaParty:
      type: object
      required: [id, kind, displayName, jurisdiction, kyc, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [person, organisation] }
        displayName: { type: string }
        jurisdiction: { type: [string, "null"] }
        kyc:
          type: object
          required: [status, reference, verifiedAt, expiresAt]
          properties:
            status: { type: string, enum: [unverified, pending, verified, rejected] }
            reference: { type: [string, "null"] }
            verifiedAt: { type: [string, "null"], format: date-time }
            expiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    RwaPartyDetail:
      allOf:
        - { $ref: "#/components/schemas/RwaParty" }
        - type: object
          required: [wallets, screenings, compliance]
          properties:
            wallets:
              type: array
              items:
                type: object
                required: [id, network, address, screening]
                properties:
                  id: { type: string, format: uuid }
                  network: { type: string }
                  address: { type: string }
                  screening:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [outcome, checkedAt]
                        properties:
                          outcome: { type: string, enum: [clear, review, blocked] }
                          checkedAt: { type: [string, "null"], format: date-time }
            screenings:
              type: array
              items:
                type: object
                required: [id, subject, walletId, provider, providerReference, outcome, reasons, checkedAt]
                properties:
                  id: { type: string, format: uuid }
                  subject: { type: string, enum: [party, wallet] }
                  walletId: { type: [string, "null"], format: uuid }
                  provider: { type: string }
                  providerReference: { type: string }
                  outcome: { type: string, enum: [clear, review, blocked] }
                  reasons: { type: array, items: { type: string } }
                  checkedAt: { type: string, format: date-time }
            compliance:
              type: object
              required: [allowed, reasons]
              properties:
                allowed: { type: boolean }
                reasons: { type: array, items: { type: string } }
    RwaOrder:
      type: object
      required: [id, reconciliationId, kind, partyId, partyName, representationId, shareAmount, settlementNetwork, tokenContract, settlementAmount, tronWallet, solanaWallet, status, approvedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reconciliationId: { type: string, format: uuid }
        kind: { type: string, enum: [subscription, redemption, distribution] }
        partyId: { type: string, format: uuid }
        partyName: { type: string }
        representationId: { type: [string, "null"], format: uuid }
        shareAmount: { type: [string, "null"] }
        settlementNetwork: { type: string }
        tokenContract: { type: string }
        settlementAmount: { type: string }
        tronWallet: { type: [string, "null"] }
        solanaWallet: { type: [string, "null"] }
        status: { type: string, enum: [open, settling, issuing, completed, cancelled, exception] }
        approvedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RwaOrderDetail:
      allOf:
        - { $ref: "#/components/schemas/RwaOrder" }
        - type: object
          required: [issuance, settlement, cases, discrepancies]
          properties:
            issuance:
              type: array
              items:
                type: object
                required: [id, action, amount, holder, status, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  action: { type: string }
                  amount: { type: [string, "null"] }
                  holder: { type: string }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
            settlement:
              type: array
              items:
                type: object
                required: [id, purpose, direction, amount, payer, payee, status, txId, observedAmount, observedBlock, observedAt, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  purpose: { type: string }
                  direction: { type: string, enum: [outbound, inbound] }
                  amount: { type: string }
                  payer: { type: string }
                  payee: { type: string }
                  status: { type: string }
                  txId: { type: [string, "null"] }
                  observedAmount: { type: [string, "null"] }
                  observedBlock: { type: [string, "null"] }
                  observedAt: { type: [string, "null"], format: date-time }
                  createdAt: { type: string, format: date-time }
            cases:
              type: array
              items:
                type: object
                required: [id, kind, status, expected, observed, openedAt, resolvedAt, resolutionNote]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string }
                  status: { type: string }
                  expected: { type: object }
                  observed: { type: object }
                  openedAt: { type: string, format: date-time }
                  resolvedAt: { type: [string, "null"], format: date-time }
                  resolutionNote: { type: [string, "null"] }
            discrepancies: { type: array, items: { type: string } }
    Money:
      type: object
      required: [currency, amount, entries]
      properties:
        currency: { type: string }
        amount: { type: string, description: Decimal as text }
        entries: { type: integer }
    PeriodReport:
      type: object
      required: [from, to, farm, tasks, inputs, harvests, spending, alerts, observations, farms]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        farm:
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        tasks:
          type: object
          required: [completed, due, dueStillOpen, byKind, byPerson]
          properties:
            completed: { type: integer }
            due: { type: integer, description: Tasks due in the period (not cancelled) }
            dueStillOpen: { type: integer }
            byKind:
              type: array
              items:
                type: object
                required: [kind, count]
                properties:
                  kind: { type: string }
                  count: { type: integer }
            byPerson:
              type: array
              items:
                type: object
                required: [userId, name, count]
                properties:
                  userId: { type: [string, "null"], format: uuid }
                  name: { type: [string, "null"] }
                  count: { type: integer }
        inputs:
          type: array
          items:
            type: object
            required: [itemId, name, category, unit, used, applications]
            properties:
              itemId: { type: string, format: uuid }
              name: { type: string }
              category: { type: string }
              unit: { type: string }
              used: { type: string }
              applications: { type: integer }
        harvests:
          type: array
          items:
            type: object
            required: [crop, unit, quantity, batches]
            properties:
              crop: { type: string }
              unit: { type: string }
              quantity: { type: string }
              batches: { type: integer }
        spending:
          type: object
          required: [deliveries, servicing]
          properties:
            deliveries: { type: array, items: { $ref: "#/components/schemas/Money" } }
            servicing: { type: array, items: { $ref: "#/components/schemas/Money" } }
        alerts:
          type: object
          required: [info, warning, critical]
          properties:
            info: { type: integer }
            warning: { type: integer }
            critical: { type: integer }
        observations:
          type: object
          required: [userEntered, sensorReported, providerObservation]
          properties:
            userEntered: { type: integer }
            sensorReported: { type: integer }
            providerObservation: { type: integer }
        farms:
          type: array
          items:
            type: object
            required: [farmId, name, tasksCompleted, applications, harvestBatches, alerts]
            properties:
              farmId: { type: string, format: uuid }
              name: { type: string }
              tasksCompleted: { type: integer }
              applications: { type: integer }
              harvestBatches: { type: integer }
              alerts: { type: integer }
    Me:
      type: object
      required: [userId, tenants]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        tenants:
          type: array
          items:
            type: object
            required: [tenantId, slug, name, role]
            properties:
              tenantId: { type: string, format: uuid }
              slug: { type: string }
              name: { type: string }
              role: { $ref: "#/components/schemas/Role" }

    LonLat:
      type: object
      required: [lon, lat]
      properties:
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -90, maximum: 90 }

    CreateFarm:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        origin: { $ref: "#/components/schemas/LonLat" }
        timezone: { type: string, default: UTC }

    Farm:
      type: object
      required: [id, name, timezone, origin, originProvenance, currentBoundaryVersionId, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        timezone: { type: string }
        origin:
          oneOf:
            - { $ref: "#/components/schemas/LonLat" }
            - { type: "null" }
        originProvenance: { $ref: "#/components/schemas/ProvenanceLabel" }
        currentBoundaryVersionId: { type: [string, "null"], format: uuid }
        outline:
          description: Simplified outer ring of the current boundary as [lon, lat] pairs, for drawing small outlines. Not for measurement.
          type: [array, "null"]
          items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        boundaryAreaM2: { type: [number, "null"], description: Geodesic area of the current boundary in m² (estimate from the submitted shape). }
        archivedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, role, displayName, email, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        displayName: { type: [string, "null"], description: Self-reported by the member. }
        email: { type: [string, "null"], description: Self-reported by the member; not verified. }
        joinedAt: { type: string, format: date-time }

    Invitation:
      type: object
      required: [id, email, role, invitedBy, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invitedBy: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    SubmitBoundary:
      type: object
      required: [geojson, source]
      properties:
        geojson:
          description: GeoJSON Polygon/MultiPolygon/Feature/FeatureCollection (one feature). WGS 84 lon/lat.
          type: object
          additionalProperties: true
        source: { type: string, enum: [drawn, imported, coordinates] }
        note: { type: string, maxLength: 1000 }

    GeometryIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_STRUCTURE
            - UNSUPPORTED_GEOMETRY_TYPE
            - UNSUPPORTED_CRS
            - INPUT_TOO_DEEP
            - INVALID_COORDINATE
            - RING_NOT_CLOSED
            - RING_TOO_FEW_POSITIONS
            - RING_DEGENERATE
            - TOO_MANY_VERTICES
            - TOO_MANY_RINGS
            - TOO_MANY_POLYGONS
            - SELF_INTERSECTION
            - RINGS_INTERSECT
            - HOLE_OUTSIDE_SHELL
            - ANTIMERIDIAN_CROSSING
            - AREA_TOO_SMALL
            - AREA_TOO_LARGE
            - DUPLICATE_GEOMETRY
            - POSTGIS_INVALID
        message: { type: string }
        path: { type: array, items: { type: integer } }

    GeometryRejected:
      type: object
      required: [error, message, issues]
      properties:
        error: { type: string, enum: [geometry_rejected, duplicate_geometry] }
        message: { type: string }
        issues: { type: array, items: { $ref: "#/components/schemas/GeometryIssue" } }

    BoundaryVersion:
      type: object
      required: [id, farmId, version, geojson, crs, source, provenance, areaM2, vertexCount, validationStatus, validationIssues, submittedAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        version: { type: integer }
        geojson: { type: object, additionalProperties: true, description: GeoJSON MultiPolygon }
        crs: { type: string, enum: ["OGC:CRS84"] }
        source: { type: string, enum: [drawn, imported, coordinates] }
        provenance:
          type: string
          enum: [user-entered, independently-verified]
        areaM2: { type: number, description: Geodesic area computed from the submitted geometry; not a survey. }
        vertexCount: { type: integer }
        validationStatus: { type: string, enum: [pending, valid, invalid] }
        validationIssues: { type: array, items: { $ref: "#/components/schemas/GeometryIssue" } }
        overlaps:
          type: array
          items:
            type: object
            required: [farmId, overlapM2]
            properties:
              farmId: { type: string, format: uuid }
              overlapM2: { type: number }
        note: { type: [string, "null"] }
        submittedAt: { type: string, format: date-time }
        validatedAt: { type: [string, "null"], format: date-time }

    PlanParcel:
      type: object
      required: [label, grid]
      properties:
        label: { type: string, maxLength: 80 }
        cropName: { type: string, maxLength: 120 }
        grid:
          type: object
          required: [rows, cols, spacingM]
          properties:
            rows: { type: integer, minimum: 1, maximum: 500 }
            cols: { type: integer, minimum: 1, maximum: 500 }
            spacingM: { type: number, exclusiveMinimum: 0, maximum: 50 }
        assetCatalogId: { type: string, format: uuid }

    FarmPlanInput:
      type: object
      required: [name, parcels]
      properties:
        name: { type: string, maxLength: 120 }
        season: { type: string, maxLength: 64 }
        parcels: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/PlanParcel" } }

    FarmPlan:
      allOf:
        - { $ref: "#/components/schemas/FarmPlanInput" }
        - type: object
          required: [id, farmId, provenance, createdAt]
          properties:
            id: { type: string, format: uuid }
            farmId: { type: string, format: uuid }
            provenance: { type: string, enum: [user-entered] }
            createdAt: { type: string, format: date-time }

    ScenarioRange:
      type: object
      required: [low, base, high]
      properties:
        low: { type: number, minimum: 0 }
        base: { type: number, minimum: 0 }
        high: { type: number, minimum: 0 }

    CropScenarioInput:
      type: object
      required: [cropName, yieldPerHa, yieldUnit, pricePerUnit, costs, currency]
      properties:
        cropName: { type: string, maxLength: 120 }
        plantedAreaHa: { type: number, exclusiveMinimum: 0, description: Defaults to the current boundary area. }
        yieldPerHa: { $ref: "#/components/schemas/ScenarioRange" }
        yieldUnit: { type: string, maxLength: 32 }
        pricePerUnit: { $ref: "#/components/schemas/ScenarioRange" }
        costs: { $ref: "#/components/schemas/ScenarioRange" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        assumptionsNote: { type: string, maxLength: 2000 }

    ScenarioCase:
      type: object
      required: [production, grossRevenue, costs, net]
      properties:
        production: { type: number }
        grossRevenue: { type: number }
        costs: { type: number }
        net: { type: number }

    CropScenario:
      type: object
      required: [id, farmId, kind, input, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        kind: { type: string, enum: [simulated] }
        input: { $ref: "#/components/schemas/CropScenarioInput" }
        result:
          type: object
          required: [kind, provenance, disclaimer, currency, yieldUnit, cases]
          properties:
            kind: { type: string, enum: [simulated] }
            provenance: { type: string, enum: [user-entered] }
            disclaimer: { type: string }
            currency: { type: string }
            yieldUnit: { type: string }
            cases:
              type: object
              required: [low, base, high]
              properties:
                low: { $ref: "#/components/schemas/ScenarioCase" }
                base: { $ref: "#/components/schemas/ScenarioCase" }
                high: { $ref: "#/components/schemas/ScenarioCase" }
        createdAt: { type: string, format: date-time }

    Asset:
      type: object
      required: [id, kind, name, license, provenance]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [plant, equipment, structure, decoration] }
        name: { type: string }
        description: { type: [string, "null"] }
        procedural: { type: [object, "null"], additionalProperties: true }
        modelMediaId: { type: [string, "null"], format: uuid }
        license: { type: string }
        provenance: { type: string, enum: [illustrative] }
        scope: { type: string, enum: [global, tenant] }

    SceneEntity:
      type: object
      required: [id, kind, assetId, x, z, rotation, scale, provenance]
      properties:
        id: { type: string, description: Stable entity id (unchanged across reloads for the same plan). }
        kind: { type: string, enum: [plant, equipment, structure, decoration, sensor] }
        assetId: { type: string }
        label: { type: string }
        x: { type: number, description: Metres east of origin }
        z: { type: number, description: Metres south of origin (three.js convention) }
        rotation: { type: number }
        scale: { type: number }
        provenance: { $ref: "#/components/schemas/ProvenanceLabel" }

    SceneDescription:
      type: object
      required: [farmId, seed, origin, boundaryLocal, entities, disclaimer]
      properties:
        farmId: { type: string, format: uuid }
        seed: { type: integer }
        origin:
          oneOf:
            - { $ref: "#/components/schemas/LonLat" }
            - { type: "null" }
        boundaryLocal:
          description: Exterior rings in local metres [x, z].
          type: array
          items:
            type: array
            items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        entities: { type: array, items: { $ref: "#/components/schemas/SceneEntity" } }
        disclaimer: { type: string }

    ObservationInput:
      type: object
      required: [metric, value, unit, observedAt]
      properties:
        metric:
          type: string
          enum: [soil_moisture, air_temperature, soil_temperature, rainfall, relative_humidity, ndvi, note]
        value:
          oneOf:
            - { type: number }
            - { type: string, maxLength: 4000 }
        unit: { type: string, maxLength: 32 }
        observedAt: { type: string, format: date-time }
        sensorId: { type: string, format: uuid }

    Observation:
      type: object
      required: [id, farmId, metric, value, unit, observedAt, provenance, qualityFlags]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        sensorId: { type: [string, "null"], format: uuid }
        metric: { type: string }
        value: { type: [number, "null"] }
        text: { type: [string, "null"] }
        unit: { type: string }
        observedAt: { type: string, format: date-time }
        provenance: { $ref: "#/components/schemas/ProvenanceLabel" }
        qualityFlags: { type: array, items: { type: string } }

    Alert:
      type: object
      required: [id, farmId, severity, message, status, evidenceObservationIds, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        ruleId: { type: [string, "null"], format: uuid }
        severity: { type: string, enum: [info, warning, critical] }
        message: { type: string }
        status: { type: string, enum: [open, acknowledged, resolved] }
        evidenceObservationIds: { type: array, items: { type: string, format: uuid } }
        acknowledgedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    TaskKind:
      type: string
      enum: [irrigation, fertilizing, spraying, planting, weeding, pruning, harvest, scouting, maintenance, other]

    TaskInput:
      type: object
      additionalProperties: false
      required: [title, kind, dueDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: "#/components/schemas/TaskKind" }
        parcelLabel: { type: [string, "null"], maxLength: 80 }
        assigneeUserId: { type: [string, "null"], format: uuid }
        dueDate: { type: string, format: date, description: Calendar day in the farm's time zone }
        priority: { type: string, enum: [low, normal, high], default: normal }
        notes: { type: [string, "null"], maxLength: 4000 }
        repeatEveryDays: { type: [integer, "null"], minimum: 1, maximum: 365 }

    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: "#/components/schemas/TaskKind" }
        parcelLabel: { type: [string, "null"], maxLength: 80 }
        assigneeUserId: { type: [string, "null"], format: uuid }
        dueDate: { type: string, format: date }
        priority: { type: string, enum: [low, normal, high] }
        notes: { type: [string, "null"], maxLength: 4000 }
        repeatEveryDays: { type: [integer, "null"], minimum: 1, maximum: 365 }
        status: { type: string, enum: [todo, in_progress, cancelled] }

    TaskCompletion:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 4000 }
        mediaIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
        inputs:
          type: array
          maxItems: 10
          description: Inputs used doing the task, recorded as stock use on the task's farm and parcel (inventory:use).
          items:
            type: object
            additionalProperties: false
            required: [itemId, quantity]
            properties:
              itemId: { type: string, format: uuid }
              quantity: { $ref: "#/components/schemas/Quantity" }

    Task:
      type: object
      required: [id, farmId, farmName, title, kind, dueDate, priority, status, completionMediaIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        title: { type: string }
        kind: { $ref: "#/components/schemas/TaskKind" }
        parcelLabel: { type: [string, "null"] }
        assigneeUserId: { type: [string, "null"], format: uuid }
        assigneeName: { type: [string, "null"] }
        dueDate: { type: string, format: date }
        priority: { type: string, enum: [low, normal, high] }
        status: { type: string, enum: [todo, in_progress, done, cancelled] }
        notes: { type: [string, "null"] }
        repeatEveryDays: { type: [integer, "null"] }
        previousTaskId: { type: [string, "null"], format: uuid }
        completionNote: { type: [string, "null"] }
        completionMediaIds: { type: array, items: { type: string, format: uuid } }
        completedAt: { type: [string, "null"], format: date-time }
        completedByName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HarvestInput:
      type: object
      additionalProperties: false
      required: [cropName, harvestedOn, quantity, unit]
      properties:
        cropName: { type: string, minLength: 1, maxLength: 120 }
        parcelLabel: { type: [string, "null"], maxLength: 80 }
        harvestedOn: { type: string, format: date }
        quantity: { type: string, pattern: "^\\d{1,11}(\\.\\d{1,3})?$", description: "Decimal as text, greater than zero" }
        unit: { type: string, minLength: 1, maxLength: 16 }
        qualityGrade: { type: [string, "null"], maxLength: 40 }
        notes: { type: [string, "null"], maxLength: 4000, description: Private to the workspace }
        taskId: { type: [string, "null"], format: uuid }
        seasonId: { type: [string, "null"], format: uuid, description: "Omit to use the single active season for this parcel and crop" }

    HarvestPublicRecord:
      type: object
      required: [v, batch, producer, farm, crop, parcel, harvestedOn, quantity, unit, grade, recordedAt]
      properties:
        v: { type: integer, enum: [1] }
        batch: { type: string }
        producer: { type: string }
        farm: { type: string }
        crop: { type: string }
        parcel: { type: [string, "null"] }
        harvestedOn: { type: string, format: date }
        quantity: { type: string }
        unit: { type: string }
        grade: { type: [string, "null"] }
        recordedAt: { type: string, format: date-time }

    AnchorStatus:
      type: string
      enum: [not_configured, pending, submitted, confirmed, failed]

    HarvestAnchor:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/AnchorStatus" }
        chainId: { type: [integer, "null"] }
        chainName: { type: [string, "null"] }
        contract: { type: [string, "null"] }
        txHash: { type: [string, "null"] }
        block: { type: [string, "null"] }
        anchoredAt: { type: [string, "null"], format: date-time }
        explorerUrl: { type: [string, "null"] }
        error: { type: [string, "null"] }

    Harvest:
      type: object
      required: [id, farmId, code, cropName, harvestedOn, quantity, unit, publicRecord, recordHash, anchor, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        code: { type: string }
        cropName: { type: string }
        parcelLabel: { type: [string, "null"] }
        harvestedOn: { type: string, format: date }
        quantity: { type: string }
        unit: { type: string }
        qualityGrade: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        taskId: { type: [string, "null"], format: uuid }
        seasonId: { type: [string, "null"], format: uuid }
        publicRecord: { $ref: "#/components/schemas/HarvestPublicRecord" }
        recordHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        anchor: { $ref: "#/components/schemas/HarvestAnchor" }
        voidedAt: { type: [string, "null"], format: date-time }
        voidReason: { type: [string, "null"] }
        voidAnchorStatus:
          oneOf:
            - { $ref: "#/components/schemas/AnchorStatus" }
            - { type: "null" }
        recordedByName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    PublicHarvest:
      type: object
      required: [code, record, recordHash, chainBatchId, anchor, chainCheck, voidedAt]
      properties:
        code: { type: string }
        record: { $ref: "#/components/schemas/HarvestPublicRecord" }
        recordHash: { type: string }
        chainBatchId: { type: string, description: "bytes32 id in the registry (the batch UUID, left-padded)" }
        anchor: { $ref: "#/components/schemas/HarvestAnchor" }
        chainCheck:
          oneOf:
            - type: object
              required: [onChainHash, matches, registeredAt, voidedOnChain]
              properties:
                onChainHash: { type: [string, "null"] }
                matches: { type: boolean }
                registeredAt: { type: [string, "null"], format: date-time }
                voidedOnChain: { type: boolean }
            - { type: "null" }
        voidedAt: { type: [string, "null"], format: date-time }

    Quantity:
      type: string
      pattern: "^\\d{1,11}(\\.\\d{1,3})?$"
      description: "Positive decimal as text, up to 3 decimals"

    InputCategory:
      type: string
      enum: [seed, fertilizer, crop-protection, fuel, packaging, other]

    InputItemInput:
      type: object
      additionalProperties: false
      required: [name, category, unit]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: "#/components/schemas/InputCategory" }
        unit: { type: string, minLength: 1, maxLength: 16 }
        reorderLevel: { type: [string, "null"] }
        preHarvestIntervalDays: { type: [integer, "null"], minimum: 0, maximum: 365 }
        reEntryHours: { type: [integer, "null"], minimum: 0, maximum: 720 }
        notes: { type: [string, "null"], maxLength: 2000 }

    InputItemUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: "#/components/schemas/InputCategory" }
        unit: { type: string, minLength: 1, maxLength: 16 }
        reorderLevel: { type: [string, "null"] }
        preHarvestIntervalDays: { type: [integer, "null"], minimum: 0, maximum: 365 }
        reEntryHours: { type: [integer, "null"], minimum: 0, maximum: 720 }
        notes: { type: [string, "null"], maxLength: 2000 }
        archived: { type: boolean }

    InputItem:
      type: object
      required: [id, name, category, unit, archived, onHand, lowStock, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: "#/components/schemas/InputCategory" }
        unit: { type: string }
        reorderLevel: { type: [string, "null"] }
        preHarvestIntervalDays: { type: [integer, "null"] }
        reEntryHours: { type: [integer, "null"] }
        notes: { type: [string, "null"] }
        archived: { type: boolean }
        onHand: { type: string, description: Signed decimal; negative means use was recorded before the delivery }
        lowStock: { type: boolean }
        lastMovementOn: { type: [string, "null"], format: date }
        createdAt: { type: string, format: date-time }

    StockMovementInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, itemId, quantity, occurredOn]
          properties:
            kind: { type: string, enum: [receive] }
            itemId: { type: string, format: uuid }
            quantity: { $ref: "#/components/schemas/Quantity" }
            occurredOn: { type: string, format: date }
            supplier: { type: [string, "null"], maxLength: 120 }
            lot: { type: [string, "null"], maxLength: 60 }
            expiresOn: { type: [string, "null"], format: date }
            cost: { type: [string, "null"] }
            currency: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
            note: { type: [string, "null"], maxLength: 1000 }
        - type: object
          additionalProperties: false
          required: [kind, itemId, quantity, occurredOn, farmId]
          properties:
            kind: { type: string, enum: [use] }
            itemId: { type: string, format: uuid }
            quantity: { $ref: "#/components/schemas/Quantity" }
            occurredOn: { type: string, format: date }
            farmId: { type: string, format: uuid }
            parcelLabel: { type: [string, "null"], maxLength: 80 }
            taskId: { type: [string, "null"], format: uuid }
            note: { type: [string, "null"], maxLength: 1000 }
        - type: object
          additionalProperties: false
          required: [kind, itemId, quantity, occurredOn, note]
          properties:
            kind: { type: string, enum: [adjust] }
            itemId: { type: string, format: uuid }
            quantity: { type: string, pattern: "^-?\\d{1,11}(\\.\\d{1,3})?$" }
            occurredOn: { type: string, format: date }
            note: { type: string, minLength: 3, maxLength: 1000 }

    StockMovement:
      type: object
      required: [id, itemId, itemName, itemUnit, itemCategory, kind, quantity, occurredOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        itemUnit: { type: string }
        itemCategory: { $ref: "#/components/schemas/InputCategory" }
        kind: { type: string, enum: [receive, use, adjust] }
        quantity: { type: string, description: "Signed change to stock" }
        occurredOn: { type: string, format: date }
        farmId: { type: [string, "null"], format: uuid }
        farmName: { type: [string, "null"] }
        parcelLabel: { type: [string, "null"] }
        taskId: { type: [string, "null"], format: uuid }
        taskTitle: { type: [string, "null"] }
        supplier: { type: [string, "null"] }
        lot: { type: [string, "null"] }
        expiresOn: { type: [string, "null"], format: date }
        cost: { type: [string, "null"] }
        currency: { type: [string, "null"] }
        note: { type: [string, "null"] }
        recordedByName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    PhiRestriction:
      type: object
      required: [itemId, itemName, appliedOn, preHarvestIntervalDays, harvestAllowedFrom]
      properties:
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        parcelLabel: { type: [string, "null"] }
        appliedOn: { type: string, format: date }
        preHarvestIntervalDays: { type: integer }
        harvestAllowedFrom: { type: string, format: date }

    SeasonStage:
      type: string
      enum: [land-preparation, sowing, emergence, vegetative, flowering, fruit-set, ripening, harvest, post-harvest]

    SeasonInput:
      type: object
      additionalProperties: false
      required: [cropName, plannedStart]
      properties:
        cropName: { type: string, minLength: 1, maxLength: 120 }
        variety: { type: [string, "null"], maxLength: 120 }
        parcelLabel: { type: [string, "null"], maxLength: 80, description: "Empty for the whole farm" }
        areaHa: { type: [string, "null"], pattern: "^\\d{1,7}(\\.\\d{1,4})?$" }
        plannedStart: { type: string, format: date }
        expectedHarvestFrom: { type: [string, "null"], format: date }
        status: { type: string, enum: [planned, active], default: active }
        notes: { type: [string, "null"], maxLength: 4000 }

    SeasonUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        variety: { type: [string, "null"], maxLength: 120 }
        areaHa: { type: [string, "null"] }
        expectedHarvestFrom: { type: [string, "null"], format: date }
        notes: { type: [string, "null"], maxLength: 4000 }
        status: { type: string, enum: [planned, active, closed] }
        endedOn: { type: [string, "null"], format: date, description: "Required when closing" }

    StageEntry:
      type: object
      additionalProperties: false
      required: [stage, observedOn]
      properties:
        stage: { $ref: "#/components/schemas/SeasonStage" }
        observedOn: { type: string, format: date }
        note: { type: [string, "null"], maxLength: 2000 }

    Season:
      type: object
      required: [id, farmId, farmName, cropName, plannedStart, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        cropName: { type: string }
        variety: { type: [string, "null"] }
        parcelLabel: { type: [string, "null"] }
        areaHa: { type: [string, "null"] }
        plannedStart: { type: string, format: date }
        expectedHarvestFrom: { type: [string, "null"], format: date }
        status: { type: string, enum: [planned, active, closed] }
        endedOn: { type: [string, "null"], format: date }
        notes: { type: [string, "null"] }
        currentStage:
          oneOf:
            - { $ref: "#/components/schemas/SeasonStage" }
            - { type: "null" }
        currentStageOn: { type: [string, "null"], format: date }
        createdAt: { type: string, format: date-time }

    SeasonDetail:
      type: object
      required: [season, today, stages, harvest, inputs, tasks]
      properties:
        season: { $ref: "#/components/schemas/Season" }
        today: { type: string, format: date, description: "Today in the farm's time zone" }
        stages:
          type: array
          items:
            type: object
            required: [id, stage, observedOn]
            properties:
              id: { type: string, format: uuid }
              stage: { $ref: "#/components/schemas/SeasonStage" }
              observedOn: { type: string, format: date }
              note: { type: [string, "null"] }
              recordedByName: { type: [string, "null"] }
        harvest:
          type: object
          required: [batches, totals]
          properties:
            batches:
              type: array
              items:
                type: object
                required: [id, code, harvestedOn, quantity, unit, voided]
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
                  harvestedOn: { type: string, format: date }
                  quantity: { type: string }
                  unit: { type: string }
                  voided: { type: boolean }
            totals:
              type: array
              items:
                type: object
                required: [unit, quantity, perHa]
                properties:
                  unit: { type: string }
                  quantity: { type: string }
                  perHa: { type: [string, "null"] }
        inputs:
          type: array
          items:
            type: object
            required: [itemId, itemName, unit, quantity, applications]
            properties:
              itemId: { type: string, format: uuid }
              itemName: { type: string }
              unit: { type: string }
              quantity: { type: string }
              applications: { type: integer }
        tasks:
          type: object
          required: [done, open]
          properties:
            done: { type: integer }
            open: { type: integer }

    EquipmentKind:
      type: string
      enum: [tractor, sprayer, harvester, pump, irrigation, vehicle, implement, tool, other]

    EquipmentInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: "#/components/schemas/EquipmentKind" }
        makeModel: { type: [string, "null"], maxLength: 120 }
        serial: { type: [string, "null"], maxLength: 80 }
        farmId: { type: [string, "null"], format: uuid }
        tracksHours: { type: boolean, default: false }
        currentHours: { type: [string, "null"], pattern: "^\\d{1,7}(\\.\\d)?$" }
        notes: { type: [string, "null"], maxLength: 2000 }

    EquipmentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: "#/components/schemas/EquipmentKind" }
        makeModel: { type: [string, "null"], maxLength: 120 }
        serial: { type: [string, "null"], maxLength: 80 }
        farmId: { type: [string, "null"], format: uuid }
        tracksHours: { type: boolean }
        status: { type: string, enum: [active, out_of_service, retired] }
        statusNote: { type: [string, "null"], maxLength: 500 }
        notes: { type: [string, "null"], maxLength: 2000 }

    Equipment:
      type: object
      required: [id, name, kind, tracksHours, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/EquipmentKind" }
        makeModel: { type: [string, "null"] }
        serial: { type: [string, "null"] }
        farmId: { type: [string, "null"], format: uuid }
        farmName: { type: [string, "null"] }
        tracksHours: { type: boolean }
        status: { type: string, enum: [active, out_of_service, retired] }
        statusNote: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        currentHours: { type: [string, "null"] }
        currentHoursOn: { type: [string, "null"], format: date }
        createdAt: { type: string, format: date-time }

    EquipmentSummary:
      allOf:
        - { $ref: "#/components/schemas/Equipment" }
        - type: object
          required: [maintenance]
          properties:
            maintenance:
              type: object
              required: [overdue, soon, state]
              properties:
                overdue: { type: integer }
                soon: { type: integer }
                state: { $ref: "#/components/schemas/DueState" }

    DueState:
      type: string
      enum: [overdue, soon, ok]

    MeterReadingInput:
      type: object
      additionalProperties: false
      required: [hours, readOn]
      properties:
        hours: { type: string, pattern: "^\\d{1,7}(\\.\\d)?$" }
        readOn: { type: string, format: date }
        note: { type: [string, "null"], maxLength: 500 }

    MaintenancePlanInput:
      type: object
      additionalProperties: false
      required: [title, lastDoneOn]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        everyHours: { type: [integer, "null"], minimum: 1, maximum: 100000 }
        everyDays: { type: [integer, "null"], minimum: 1, maximum: 3650 }
        lastDoneOn: { type: string, format: date }
        lastDoneHours: { type: [string, "null"] }
        notes: { type: [string, "null"], maxLength: 1000 }

    MaintenancePlan:
      type: object
      required: [id, title, lastDoneOn, due]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        everyHours: { type: [integer, "null"] }
        everyDays: { type: [integer, "null"] }
        lastDoneOn: { type: string, format: date }
        lastDoneHours: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        due:
          type: object
          required: [state, dueOn, dueHours]
          properties:
            state: { $ref: "#/components/schemas/DueState" }
            dueOn: { type: [string, "null"], format: date }
            dueHours: { type: [number, "null"] }

    ServiceRecordInput:
      type: object
      additionalProperties: false
      required: [doneOn, description]
      properties:
        planId: { type: [string, "null"], format: uuid }
        doneOn: { type: string, format: date }
        hours: { type: [string, "null"] }
        description: { type: string, minLength: 1, maxLength: 1000 }
        cost: { type: [string, "null"] }
        currency: { type: [string, "null"], pattern: "^[A-Z]{3}$" }

    EquipmentDetail:
      type: object
      required: [equipment, today, plans, readings, services]
      properties:
        equipment: { $ref: "#/components/schemas/Equipment" }
        today: { type: string, format: date }
        plans: { type: array, items: { $ref: "#/components/schemas/MaintenancePlan" } }
        readings:
          type: array
          items:
            type: object
            required: [id, hours, readOn]
            properties:
              id: { type: string, format: uuid }
              hours: { type: string }
              readOn: { type: string, format: date }
              note: { type: [string, "null"] }
              recordedByName: { type: [string, "null"] }
        services:
          type: array
          items:
            type: object
            required: [id, doneOn, description]
            properties:
              id: { type: string, format: uuid }
              planTitle: { type: [string, "null"] }
              doneOn: { type: string, format: date }
              hours: { type: [string, "null"] }
              description: { type: string }
              cost: { type: [string, "null"] }
              currency: { type: [string, "null"] }
              recordedByName: { type: [string, "null"] }

    SensorKind:
      type: string
      enum: [soil-moisture, weather-station, temperature, rain-gauge, humidity, multi, other]

    SensorInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: "#/components/schemas/SensorKind" }
        parcelLabel: { type: [string, "null"], maxLength: 80 }
        location:
          oneOf:
            - { $ref: "#/components/schemas/LonLat" }
            - { type: "null" }
        silentAfterMinutes: { type: integer, minimum: 5, maximum: 10080, default: 180 }

    SensorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        parcelLabel: { type: [string, "null"], maxLength: 80 }
        status: { type: string, enum: [active, disabled] }
        silentAfterMinutes: { type: integer, minimum: 5, maximum: 10080 }

    Sensor:
      type: object
      required: [id, farmId, name, kind, status, state, silentAfterMinutes, latest, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        parcelLabel: { type: [string, "null"] }
        location:
          oneOf:
            - { $ref: "#/components/schemas/LonLat" }
            - { type: "null" }
        status: { type: string, enum: [active, disabled] }
        state: { type: string, enum: [disabled, waiting, online, silent] }
        lastSeenAt: { type: [string, "null"], format: date-time }
        silentAfterMinutes: { type: integer }
        credentialRotatedAt: { type: [string, "null"], format: date-time }
        latest:
          type: array
          items:
            type: object
            required: [metric, value, unit, observedAt]
            properties:
              metric: { type: string }
              value: { type: [number, "null"] }
              unit: { type: string }
              observedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    SensorWithToken:
      type: object
      required: [sensor, token]
      properties:
        sensor: { $ref: "#/components/schemas/Sensor" }
        token: { type: string, description: "Device token; shown only in this response" }

    IngestReadings:
      type: object
      additionalProperties: false
      required: [readings]
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [metric, value, unit, observedAt]
            properties:
              metric: { type: string, enum: [soil_moisture, air_temperature, soil_temperature, rainfall, relative_humidity, ndvi] }
              value: { type: number }
              unit: { type: string, maxLength: 32 }
              observedAt: { type: string, format: date-time }

    AlertRuleInput:
      type: object
      additionalProperties: false
      required: [metric, comparator, threshold, severity]
      properties:
        metric: { type: string, enum: [soil_moisture, air_temperature, soil_temperature, rainfall, relative_humidity, ndvi] }
        comparator: { type: string, enum: [lt, lte, gt, gte] }
        threshold: { type: number, description: "In the metric's canonical unit" }
        consecutive: { type: integer, minimum: 1, maximum: 50, default: 1 }
        severity: { type: string, enum: [info, warning, critical] }
        windowMinutes: { type: integer, minimum: 1, maximum: 43200, default: 60 }

    AlertRule:
      type: object
      required: [id, metric, comparator, threshold, consecutive, severity, windowMinutes, enabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        metric: { type: string }
        comparator: { type: string, enum: [lt, lte, gt, gte] }
        threshold: { type: number }
        consecutive: { type: integer }
        severity: { type: string, enum: [info, warning, critical] }
        windowMinutes: { type: integer }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, kind, data, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [task_assigned, alert_raised, low_stock, maintenance_due] }
        data: { type: object, additionalProperties: true, description: "Facts for the reader's app to render in its language" }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    UploadRequest:
      type: object
      required: [filename, contentType, byteSize, purpose, sha256]
      properties:
        filename: { type: string, maxLength: 200 }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf, application/geo+json, model/gltf-binary]
        byteSize: { type: integer, minimum: 1 }
        purpose: { type: string, enum: [boundary-import, observation-photo, verification-evidence, asset-model] }
        farmId: { type: string, format: uuid }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    UploadTicket:
      type: object
      required: [mediaId, uploadUrl, method, headers, expiresAt]
      properties:
        mediaId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }

    MediaObject:
      type: object
      required: [id, filename, contentType, byteSize, purpose, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: [string, "null"], format: uuid }
        filename: { type: string }
        contentType: { type: string }
        byteSize: { type: integer }
        purpose: { type: string }
        status: { type: string, enum: [pending, uploaded, rejected, deleted] }
        createdAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, actorType, action, outcome, createdAt]
      properties:
        id: { type: string }
        actorUserId: { type: [string, "null"], format: uuid }
        actorType: { type: string, enum: [user, system, webhook, job] }
        action: { type: string }
        targetType: { type: [string, "null"] }
        targetId: { type: [string, "null"] }
        outcome: { type: string, enum: [success, denied, failure] }
        requestId: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    NftMetadata:
      $ref: "./nft-metadata.schema.json"
