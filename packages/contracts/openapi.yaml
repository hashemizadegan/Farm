      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "No hour meter, or the reading is lower than the last one" }

  /v1/tenants/{tenantId}/equipment/{equipmentId}/plans:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [equipment]
      summary: Add a maintenance plan (equipment:manage)
      operationId: createMaintenancePlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenancePlanInput" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenancePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/equipment/{equipmentId}/plans/{planId}/archive:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [equipment]
      summary: Stop a maintenance plan (equipment:manage)
      operationId: archiveMaintenancePlan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { archived: { type: boolean } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/equipment/{equipmentId}/plans/{planId}/task:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [equipment]
      summary: Create a maintenance task on the machine's farm (task:manage)
      operationId: createMaintenanceTask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                assigneeUserId: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The machine has no farm }

  /v1/tenants/{tenantId}/equipment/{equipmentId}/services:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [equipment]
      summary: Record a service or repair (equipment:use)
      operationId: recordService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRecordInput" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/sensors:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [sensors]
      summary: Sensors with their state and latest readings
      operationId: listSensors
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: 
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Sensor" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [sensors]
      summary: Register a sensor (sensor:manage); returns its device token once
      operationId: createSensor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensorInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorWithToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/farms/{farmId}/sensors/{sensorId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: sensorId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [sensors]
      summary: Rename, move, disable or change the silence allowance (sensor:manage)
      operationId: updateSensor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensorUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sensor" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/sensors/{sensorId}/rotate:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: sensorId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [sensors]
      summary: Issue a new device token; the old one stops working (sensor:manage)
      operationId: rotateSensorToken
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorWithToken" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ingest/readings:
    post:
      tags: [sensors]
      security: []
      summary: Readings from a device (Authorization "Sensor <token>")
      description: |
        Devices send up to 200 numeric readings per request over HTTPS, with
        `Authorization: Sensor <token>`. Readings are normalised like any other
        observation and labelled `sensor-reported`.
      operationId: ingestReadings
      parameters:
        - { name: authorization, in: header, required: true, schema: { type: string, pattern: "^Sensor mfs_" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestReadings" }
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/tenants/{tenantId}/farms/{farmId}/alert-rules:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [alerts]
      summary: Alert rules of a farm
      operationId: listAlertRules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: 
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
    post:
      tags: [alerts]
      summary: Add an alert rule (sensor:manage)
      operationId: createAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/farms/{farmId}/alert-rules/{ruleId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [alerts]
      summary: Turn an alert rule on or off (sensor:manage)
      operationId: updateAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/notifications:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [notifications]
      summary: Your notifications in this workspace, newest first
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unread, items]
                properties:
                  unread: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }

  /v1/tenants/{tenantId}/notifications/read:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [notifications]
      summary: Mark notifications read
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [all]
                  properties:
                    all: { type: boolean, enum: [true] }
                - type: object
                  additionalProperties: false
                  required: [ids]
                  properties:
                    ids: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked: { type: integer }

  /v1/tenants/{tenantId}/exports/{dataset}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: dataset, in: path, required: true, schema: { type: string, enum: [input-log, harvests, tasks, stock] } }
    get:
      tags: [exports]
      summary: Download records as a spreadsheet (CSV)
      description: |
        input-log is every recorded use of an input (the spray and fertiliser log); harvests
        include their fingerprints and registry status; stock is a snapshot and takes no farm
        or dates. Values are machine-readable (ISO dates, Latin digits); `lang` sets only the
        column headings. UTF-8 with a byte-order mark.
      operationId: downloadExport
      parameters:
        - { name: farmId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: lang, in: query, schema: { type: string, enum: [en, fa], default: en } }
      responses:
        "200":
          description: The file
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Too many rows; choose a shorter range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/reports/summary:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [reports]
      summary: What the team recorded in a period (whole workspace or one farm)
      description: |
        Days are read in each farm's own time zone. Nothing is estimated - spending is only what
        was entered as a cost, per currency; quantities stay per unit. Deliveries recorded without
        a farm appear only in the workspace report.
      operationId: getPeriodReport
      parameters:
        - { name: farmId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/parties:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: Investors (parties)
      operationId: listRwaParties
      parameters:
        - { $ref: "#/components/parameters/RwaListLimit" }
        - { $ref: "#/components/parameters/RwaListCursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RwaParty" } }
                  nextCursor: { type: [string, "null"], format: uuid, description: "Pass as `cursor` for the next page; null on the last page." }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [rwa]
      summary: Register an investor
      operationId: createRwaParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, displayName]
              properties:
                kind: { type: string, enum: [person, organisation] }
                displayName: { type: string, minLength: 1, maxLength: 200 }
                jurisdiction: { type: [string, "null"], pattern: "^[A-Za-z]{2}$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rwa]
      summary: An investor with wallets, screenings and the current compliance decision
      operationId: getRwaParty
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}/kyc:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Record the KYC outcome from the provider's case
      operationId: recordRwaKyc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [unverified, pending, verified, rejected] }
                reference: { type: [string, "null"], description: "Provider case reference; required for verified" }
                expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}/wallets:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Register a wallet of the investor
      operationId: addRwaWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [network, address]
              properties:
                network: { type: string, enum: [solana-devnet, solana-mainnet, tron-nile, tron-shasta, tron-mainnet] }
                address: { type: string }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The address is already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/parties/{partyId}/screenings:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Record a sanctions screening of the investor or one of their wallets
      description: Screenings come from a real provider (named, with its reference). The log is append-only.
      operationId: recordRwaScreening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, providerReference, outcome, checkedAt]
              properties:
                walletId: { type: string, format: uuid }
                provider: { type: string }
                providerReference: { type: string }
                outcome: { type: string, enum: [clear, review, blocked] }
                reasons: { type: array, items: { type: string } }
                checkedAt: { type: string, format: date-time }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaPartyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/assets:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: Real-world assets and their share tokens
      operationId: listRwaAssets
      parameters:
        - { $ref: "#/components/parameters/RwaListLimit" }
        - { $ref: "#/components/parameters/RwaListCursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RwaAsset" } }
                  nextCursor: { type: [string, "null"], format: uuid, description: "Pass as `cursor` for the next page; null on the last page." }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [rwa]
      summary: Register a real-world asset (draft until a second person verifies it)
      operationId: createRwaAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [farmId, kind, name]
              properties:
                farmId: { type: string, format: uuid }
                kind: { type: string, enum: [parcel, tree, livestock, equipment, harvest_lot, farm_share, building, storage_unit, logistics_lot] }
                name: { type: string, minLength: 1, maxLength: 200 }
                externalRef: { type: string }
                parcelLabel: { type: string }
                geometry: { type: object, description: "GeoJSON Point or Polygon (WGS 84)" }
                geomProvenance: { type: string, enum: [surveyed, gnss, user-entered] }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaAsset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/assets/{assetId}/verify:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Verify an asset (someone other than who registered it)
      description: Parcels and trees need geometry, and geometry must lie within the farm's current boundary.
      operationId: verifyRwaAsset
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaAsset" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not a draft, missing geometry, or outside the farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/assets/{assetId}/representations:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Plan a Token-2022 share token for a verified asset
      operationId: createRwaRepresentation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [network, decimals]
              properties:
                network: { type: string, enum: [solana-devnet, solana-mainnet] }
                decimals: { type: integer, minimum: 0, maximum: 9 }
      responses:
        "201":
          description: Planned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaAsset" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Asset not verified, or already has a share token on that network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/assets/{assetId}/registrations:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Register a verified parcel, tree or animal as a compressed NFT held by a custodian
      description: |
        Fixes the leaf's metadata (name, symbol and a URI to its public document, which commits to
        the asset record by a salted SHA-256; no coordinates go on chain) and opens a registration
        that a second person must approve before anything is minted. The custodian must pass the
        compliance gate with the given, screened Solana wallet.
      operationId: createRwaRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [network, partyId, solanaWallet]
              properties:
                network: { type: string, enum: [solana-devnet, solana-mainnet] }
                partyId: { type: string, format: uuid }
                solanaWallet: { type: string, minLength: 32, maxLength: 44 }
      responses:
        "201":
          description: Registered; waiting for approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaRegistration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not a parcel, tree or animal; not verified; or already registered on that network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Compliance checks failed, or the metadata does not fit the program's limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Registrations not configured (RWA_CNFT_METADATA_BASE_URL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/registrations:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: Registrations and the state of their compressed NFTs
      operationId: listRwaRegistrations
      parameters:
        - { $ref: "#/components/parameters/RwaListLimit" }
        - { $ref: "#/components/parameters/RwaListCursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RwaRegistration" } }
                  nextCursor: { type: [string, "null"], format: uuid, description: "Pass as `cursor` for the next page; null on the last page." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/rwa/registrations/{registrationId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: registrationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rwa]
      summary: A registration with its reconciliation cases
      operationId: getRwaRegistration
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaRegistrationDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/registrations/{registrationId}/approve:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: registrationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Approve a registration's mint (someone other than who registered it)
      description: The platform creates the Merkle tree if needed, then mints the leaf to the custodian. Compliance is checked again now and again at signing.
      operationId: approveRwaRegistration
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaRegistration" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Compliance checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/representations/{representationId}/mint:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: representationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Link an existing Token-2022 mint, checked on chain
      description: The platform's Solana RPC must first prove (getGenesisHash) that it serves RWA_SOLANA_NETWORK. The account must then be an initialised Token-2022 mint whose mint authority is the platform's issuer (RWA_SOLANA_ISSUER).
      operationId: linkRwaMint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mintAddress]
              properties:
                mintAddress: { type: string }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaAsset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already linked, wrong network, or mint used elsewhere
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Not a Token-2022 mint controlled by the platform's issuer, or the platform's RPC serves another cluster (solana_cluster_mismatch)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Issuance not configured, or the platform's RPC could not be verified (solana_rpc_unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/orders:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [rwa]
      summary: Orders
      operationId: listRwaOrders
      parameters:
        - { $ref: "#/components/parameters/RwaListLimit" }
        - { $ref: "#/components/parameters/RwaListCursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RwaOrder" } }
                  nextCursor: { type: [string, "null"], format: uuid, description: "Pass as `cursor` for the next page; null on the last page." }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [rwa]
      summary: Place an order (passes the compliance gate)
      description: |
        Refused with 422 compliance_blocked (reasons in details) unless the investor's KYC is
        verified and current, the jurisdiction is known and permitted, and the investor and both
        wallets have clear, recent screenings. Mainnets are refused unless enabled.
      operationId: createRwaOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, partyId, settlementNetwork, tokenContract, settlementAmount, tronWallet]
              properties:
                kind: { type: string, enum: [subscription, redemption, distribution] }
                partyId: { type: string, format: uuid }
                representationId: { type: string, format: uuid }
                shareAmount: { type: string, description: Base units }
                settlementNetwork: { type: string, enum: [tron-nile, tron-shasta, tron-mainnet] }
                tokenContract: { type: string }
                settlementAmount: { type: string, description: Base units }
                tronWallet: { type: string }
                solanaWallet: { type: string }
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Compliance checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/orders/{orderId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [rwa]
      summary: An order with its intents on both rails and its reconciliation cases
      operationId: getRwaOrder
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/rwa/orders/{orderId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Cancel an order with nothing done yet
      operationId: cancelRwaOrder
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The order is already under way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/orders/{orderId}/approve:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Approve a redemption or distribution (someone other than who placed it)
      description: Only approved orders burn shares or pay out of the treasury. Compliance is checked again now and again at signing.
      operationId: approveRwaOrder
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not open, or a subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Compliance checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/rwa/orders/{orderId}/payments:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [rwa]
      summary: Record the investor's subscription payment, verified on chain
      description: |
        The TRON transaction must be solidified and be exactly the expected TRC-20 transfer
        (token, investor wallet, treasury, amount) with a successful receipt and the token's
        Transfer event. A payment can count for one order only. Repeating the call with the same
        transaction returns the order.
      operationId: recordRwaPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [txId]
              properties:
                txId: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RwaOrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Order not open, not a subscription, or payment already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Payment not verified, or compliance checks failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: TRON payment checks are not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tenants/{tenantId}/uploads:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [media]
      summary: Request a signed upload URL
      description: |
        Returns a short-lived pre-signed PUT URL. The client uploads directly to
        object storage, then calls `/complete`. The API never proxies file bytes.
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/uploads/{mediaId}/content:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [media]
      summary: Upload file bytes through the API (only when the server runs with UPLOAD_MODE=proxy)
      description: >-
        In proxy mode the uploadUrl returned by createUpload points here. Send the
        bytes with the declared content type and the same bearer token; the size
        and SHA-256 must match what was declared. Then call completeUpload.
      operationId: putUploadContent
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
          application/geo+json: { schema: { type: string, format: binary } }
          model/gltf-binary: { schema: { type: string, format: binary } }
      responses:
        "204": { description: Stored }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/uploads/{mediaId}/complete:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [media]
      summary: Confirm an upload (size and content type are checked against the stored object)
      operationId: completeUpload
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaObject" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/audit-events:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [audit]
      summary: List audit events (admin/owner)
      operationId: listAuditEvents
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: before, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/nft/metadata/validate:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [nft]
      summary: Validate NFT metadata against schema and content rules
      operationId: validateNftMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NftMetadata" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid: { type: boolean }
                  issues:
                    type: array
                    items:
                      type: object
                      required: [field, message]
                      properties:
                        field: { type: string }
                        message: { type: string }

  /v1/me/player-wallets:
    get:
      tags: [wallet]
      summary: The signed-in user's linked Solana player wallets (J8)
      description: |
        Player wallets belong to the platform (game) identity. They are not RWA party wallets and are
        never used as such. 404 unless PLAYER_WALLETS_ENABLED.
      operationId: listPlayerWallets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PlayerWallet" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [wallet]
      summary: Link a player wallet by its signature of the current challenge
      description: |
        The signature is the wallet's Ed25519 signature (signMessage) over the exact UTF-8 bytes of the
        message from the challenge. The challenge is single use: it is consumed by this call whatever
        the outcome. Linking the same wallet to the same user again returns 200 and changes nothing.
        The platform signs nothing, and no transaction is involved.
      operationId: linkPlayerWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address, signature]
              properties:
                address: { type: string, description: Solana address (base58 public key) }
                signature: { type: string, description: Base64 of the 64-byte Ed25519 signature }
      responses:
        "200":
          description: Already linked to this user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerWallet" }
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerWallet" }
        "400": { description: "invalid_request, player_wallet_challenge_missing (none, expired or used) or player_wallet_verification_failed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: player_wallet_already_linked (to another account) }

  /v1/me/player-wallets/challenge:
    post:
      tags: [wallet]
      summary: Issue the one-time message a player signs to prove control of a wallet
      operationId: createPlayerWalletChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address: { type: string }
      responses:
        "200":
          description: The exact message to sign, valid until expiresAt
          content:
            application/json:
              schema:
                type: object
                required: [address, message, expiresAt]
                properties:
                  address: { type: string }
                  message: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/player-wallets/{address}:
    parameters:
      - { name: address, in: path, required: true, schema: { type: string } }
    delete:
      tags: [wallet]
      summary: Unlink one of the signed-in user's player wallets
      operationId: unlinkPlayerWallet
      responses:
        "204": { description: Unlinked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
    post:
      tags: [webhooks]
      security: []
      summary: Receive a signed provider webhook
      description: Requires `x-webhook-signature` (`t=<unix>,v1=<hex HMAC-SHA256 of "t.body">`) and an `id` in the body for de-duplication.
      operationId: receiveWebhook
      parameters:
        - name: x-webhook-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id: { type: string, maxLength: 200 }
                type: { type: string, maxLength: 100 }
                data: { type: object, additionalProperties: true }
      responses:
        "202": { description: Accepted }
        "200": { description: Duplicate delivery ignored }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/tenants/{tenantId}/twin/farms/{farmId}/scene:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [twin]
      summary: A farm's digital-twin scene for a 3D client
      description: |
        The farm, and its assets as scene objects with their physical and chain identities. Assets
        need `rwa:read`; without it the farm is returned and every asset layer is listed in
        `redacted`. Ownership is not part of the scene: ask for an asset's detail.
      operationId: getTwinScene
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwinScene" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/twin/assets/{assetId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [twin]
      summary: An asset's identities, lifecycle, on-chain ownership and data commitments
      description: |
        Ownership comes only from the chain (an ownership reader). Without one, each representation
        reports `not_indexed`; the platform's own records are never shown as ownership.
      operationId: getTwinAsset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwinAssetDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/twin/data-commitments:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [twin]
      summary: Data commitments, newest first
      operationId: listDataCommitments
      parameters:
        - { name: subjectType, in: query, schema: { type: string, enum: [farm, asset, telemetry_window, media, record, scene_bundle] } }
        - { name: subjectId, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: "#/components/parameters/Limit" }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DataCommitment" } }
                  nextCursor: { type: [string, "null"], format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [twin]
      summary: Record the hash of off-chain data
      description: |
        Records that data about a subject, under a schema version, had this SHA-256 at its source
        time. `storageRef`, when given, must be content-addressed. Recording the same fact again
        returns the existing commitment (200). Nothing is verified on-chain.
      operationId: createDataCommitment
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectType, subjectId, schema, schemaVersion, contentSha256, sourceTime]
              properties:
                farmId: { type: string, format: uuid }
                subjectType: { type: string, enum: [farm, asset, telemetry_window, media, record, scene_bundle] }
                subjectId: { type: string, minLength: 1, maxLength: 200 }
                schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
                schemaVersion: { type: integer, minimum: 1, maximum: 10000 }
                contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                byteSize: { type: integer, minimum: 0 }
                storageRef: { type: string, maxLength: 512, description: "sha256:<hex>, s3://bucket/…/<hex>[.ext], ipfs://<cid> or ar://<id>" }
                sourceTime: { type: string, format: date-time }
                attestationRef: { type: string, maxLength: 512 }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataCommitment" }
        "200":
          description: Already recorded (same fact, or a resend with the same Idempotency-Key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataCommitment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/twin/data-commitments/batches:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [twin]
      summary: Fix a Merkle batch of commitments
      description: |
        Orders the given commitments into an RFC 9162 Merkle tree (metafarm-merkle-sha256/1) and
        stores its root. A commitment joins at most one batch. Roots are not written on-chain yet
        (`anchor` is null).
      operationId: createCommitmentBatch
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dataset, commitmentIds]
              properties:
                dataset: { type: string, pattern: "^[a-z0-9][a-z0-9._/-]{0,99}$" }
                commitmentIds: { type: array, minItems: 1, maxItems: 4096, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitmentBatch" }
        "200":
          description: A resend with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitmentBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/twin/data-commitments/{commitmentId}/proof:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: commitmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [twin]
      summary: A commitment's Merkle inclusion proof, re-checked now
      operationId: getDataCommitmentProof
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataCommitmentProof" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/twin/transfers/preview:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    post:
      tags: [twin]
      summary: Prepare a transfer for review (never submitted)
      description: |
        Checks a transfer against the chain's current holders and returns a fingerprinted preview
        that expires. Refused (409) unless an ownership reader covers the asset and shows the sender
        holding enough. Submission is unavailable in this release.
      operationId: previewTwinTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [representationId, from, to, amount]
              properties:
                representationId: { type: string, format: uuid }
                from: { type: string, pattern: "^[1-9A-HJ-NP-Za-km-z]{32,44}$" }
                to: { type: string, pattern: "^[1-9A-HJ-NP-Za-km-z]{32,44}$" }
                amount: { type: string, pattern: "^[1-9][0-9]{0,19}$", description: Base units (u64) }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/twin/transactions/{operationId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [twin]
      summary: The state of one chain operation
      operationId: getTwinTransaction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwinTransaction" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/twin/sync-status:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [twin]
      summary: Whether ownership is indexed, submission is available, and what is batched
      operationId: getTwinSyncStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwinSyncStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/twin/farms/{farmId}/snapshots:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
    get:
      tags: [twin]
      summary: A farm's recorded state snapshots, newest first
      description: For sync, a client compares the newest item with the snapshot it holds and fetches only when it changed.
      operationId: listFarmSnapshots
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DataCommitment" } }
                  nextCursor: { type: [string, "null"], format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [twin]
      summary: Record a snapshot of the farm's current state
      description: |
        Serialises the farm's assets, machines, crop seasons and stock as a canonical snapshot
        (metafarm-farm-snapshot/1), stores the bytes content-addressed, and records a data commitment
        to them. Nothing is written on-chain. Takes no body.
      operationId: createFarmSnapshot
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmSnapshotRecord" }
        "200":
          description: A resend with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmSnapshotRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/twin/snapshots/{commitmentId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: commitmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [twin]
      summary: A stored snapshot, re-verified on read
      description: The bytes are checked against their SHA-256 and the snapshot is verified end to end (`check`). The ETag is the snapshotId.
      operationId: getFarmSnapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmSnapshotDocument" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/twin/data-commitments/batches/{batchId}/anchor-plan:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: "#/components/parameters/AnchorCarrier" }
      - { $ref: "#/components/parameters/AnchorNetwork" }
    get:
      tags: [twin]
      summary: What would anchor a batch's Merkle root on Solana (data only)
      description: Nothing is stored, signed or sent; the plan always says `executable false`. Mainnet is refused unless mainnet is enabled.
      operationId: planBatchAnchor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [batchId, plan]
                properties:
                  batchId: { type: string, format: uuid }
                  plan: { $ref: "#/components/schemas/AnchorPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/twin/snapshots/{commitmentId}/content:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: commitmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [twin]
      summary: The exact stored bytes of a snapshot
      description: |
        The canonical JSON exactly as stored, re-hashed on read. SHA-256 of the body equals the
        commitment's contentSha256 (also sent as ETag and X-Content-SHA256), so a client can tie the
        snapshot it renders to the commitment, its batch inclusion proof and an anchor plan
        without trusting the API's own check. Read-only.
      operationId: getFarmSnapshotContent
      responses:
        "200":
          description: The snapshot's canonical JSON bytes
          headers:
            ETag: { schema: { type: string }, description: The quoted contentSha256 }
            X-Content-SHA256: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }

  /v1/tenants/{tenantId}/twin/snapshots/{commitmentId}/anchor-plan:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { name: commitmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: "#/components/parameters/AnchorCarrier" }
      - { $ref: "#/components/parameters/AnchorNetwork" }
    get:
      tags: [twin]
      summary: What would anchor a snapshot's root on Solana (data only)
      description: The stored snapshot is re-verified first; a snapshot that does not verify is not planned. Nothing is stored, signed or sent; the plan always says `executable false`.
      operationId: planSnapshotAnchor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [commitmentId, snapshotId, plan]
                properties:
                  commitmentId: { type: string, format: uuid }
                  snapshotId: { type: string }
                  plan: { $ref: "#/components/schemas/AnchorPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/BadRequest" }

