        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InputItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: An item with this name exists }

  /v1/tenants/{tenantId}/inventory/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
