      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Season" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [seasons]
      summary: Start or plan a crop season (plan:write)
      operationId: createSeason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeasonInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Season" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenantId}/farms/{farmId}/seasons/{seasonId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: seasonId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [seasons]
      summary: A season with its stages, harvest totals, inputs used and tasks
      operationId: getSeason
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [seasons]
      summary: Change, close or reopen a season (plan:write)
      operationId: updateSeason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeasonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Season" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenantId}/farms/{farmId}/seasons/{seasonId}/stages:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - { $ref: "#/components/parameters/FarmId" }
      - { name: seasonId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [seasons]
      summary: Record a growth stage (observation:write)
      operationId: addSeasonStage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageEntry" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Season" }
        "409": { description: The season is closed }

  /v1/tenants/{tenantId}/equipment:
